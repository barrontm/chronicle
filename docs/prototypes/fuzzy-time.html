<title>Fuzzy time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Phase 4c prototype (i). The one timeline, 820–300 BCE: Greece's eras as washes behind its rows, Athens open with its
   seven lanes, the Delian League becoming the Athenian Empire, Macedon with a start known only to the century. Under it,
   the map with a year slider, where borders change over the years a change took. A card on the right reads the picked
   record's dates back in words, with a field to type one. Tokens are Chronicle's. Classical Greece fixture, test data. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8;
  --politics: #2f5da8; --war: #c23b22; --economy: #b8860b; --society: #a33b6b; --ideas: #4b3f8c; --technology: #2e8b74; --nature: #6b7a32; --umber: #7a5a3a;
  --strip: #8d9aa3;
  --map-water: #c9d6d8; --map-land: #ece4cf; --map-border: #a9a48f; --grat: #b7c6c9;
  --font-read: 'Spectral', Georgia, serif;
  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;
  --font-ui: 'Public Sans', system-ui, sans-serif;
  --motion-quick: 150ms; --motion-move: 400ms; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
    --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --society: #d06d9a; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
    --strip: #6b7a86;
    --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
  --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --society: #d06d9a; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
  --strip: #6b7a86;
  --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--font-ui); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- prototype chrome ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 100ch; min-height: 3em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 2px; }
.stage { display: flex; justify-content: center; min-width: 0; }
.device { position: relative; width: min(1280px, 100%); height: 960px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 84vh; min-height: 640px; border: 1px solid var(--rule); border-radius: 12px; }
}

/* ---------- the app ---------- */
.app { position: absolute; inset: 0; display: grid; grid-template-rows: 46px minmax(0, 1fr); background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--rule); background: var(--panel); min-width: 0; font: 15px var(--font-read); }
.topbar .doc { font-weight: 500; }
.topbar .hint { margin-left: auto; font: 12px var(--font-ui); color: var(--muted); }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.main { display: grid; grid-template-rows: minmax(0, 1fr) 270px; min-height: 0; border-right: 1px solid var(--rule); }
.tl { position: relative; overflow-y: auto; overflow-x: hidden; background: var(--panel); }
.tl svg { display: block; width: 100%; }

.axis text { font: 12px var(--font-read); font-variant-numeric: oldstyle-nums; fill: var(--muted); }
.axis line { stroke: var(--rule-soft); }
.region { font: 600 10.5px var(--font-sc); letter-spacing: .14em; fill: var(--muted); }
.eraname { font: 500 12.5px var(--font-sc); letter-spacing: .1em; fill: var(--umber); }
.sname { font: 600 13px var(--font-sc); letter-spacing: .06em; fill: var(--ink); }
.fold { font: 11px var(--font-ui); fill: var(--muted); }
.lanebg { fill: color-mix(in srgb, var(--c) 5%, transparent); }
.lname { font: 500 11px var(--font-ui); fill: var(--ink-2); }
.lab { font: 12px var(--font-read); fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.lab.in { stroke: none; font-size: 11.5px; }
.lab.strip-in { font: 600 11px var(--font-sc); letter-spacing: .06em; stroke: none; }
.rec { cursor: pointer; }
.rec:hover .lab { fill: var(--focus); }
.rec.sel .lab { font-weight: 600; }
.rec.sel .selbox { stroke: var(--focus); stroke-width: 1.5; fill: none; }
.whisk { stroke: var(--umber); stroke-width: 1.2; fill: none; }
.tick-other { stroke: var(--umber); stroke-width: 1.4; stroke-dasharray: 2 2; }
.tick-chosen { stroke: var(--ink); stroke-width: 1.6; }
.badge circle { fill: var(--panel); stroke: var(--umber); stroke-width: 1.2; }
.badge text { font: 600 10px var(--font-ui); fill: var(--umber); }
.claimlab { font: 10.5px var(--font-ui); fill: var(--umber); }

/* the map and its clock */
.mapwrap { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; border-top: 1px solid var(--rule); }
.mapbox { position: relative; background: var(--map-water); overflow: hidden; min-height: 0; }
.mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.land { fill: var(--map-land); stroke: var(--map-border); }
.grat { stroke: var(--grat); fill: none; }
.terr { fill: color-mix(in srgb, var(--c) 28%, transparent); stroke: var(--c); }
.tname { font-family: var(--font-sc); fill: var(--ink-2); letter-spacing: .12em; paint-order: stroke; stroke: var(--map-land); stroke-linejoin: round; }
.maplegend { position: absolute; left: 10px; top: 8px; max-width: 290px; font-size: 11.5px; line-height: 1.4; color: var(--ink-2); background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 9px; border-radius: 4px; }
.maplegend b { font-weight: 600; color: var(--ink); }
.meter { display: block; height: 4px; margin-top: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--umber); }
.clock { display: flex; align-items: center; gap: 12px; padding: 7px 12px; background: var(--panel); border-top: 1px solid var(--rule); }
.clock button { border: 1px solid var(--rule); background: var(--bg); border-radius: 5px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
.clock .yr { font: 500 17px var(--font-read); font-variant-numeric: oldstyle-nums; min-width: 72px; }
.clock input { flex: 1; accent-color: var(--ink); }

/* the card */
.card { overflow-y: auto; background: var(--panel); padding: 18px 18px 30px; font-size: 13px; }
.card h2 { margin: 0; font: 500 22px/1.2 var(--font-read); }
.card .kind { margin: 3px 0 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .kind i { width: 9px; height: 9px; border-radius: 2px; background: var(--l); display: inline-block; }
.blk { border-top: 1px solid var(--rule-soft); margin-top: 14px; padding-top: 12px; }
.blk > .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.when { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px 10px; align-items: baseline; margin: 0; }
.when dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.when dd { margin: 0; }
.when .big { font: 500 16px/1.3 var(--font-read); }
.when .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.claims { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.claims li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; padding: 7px 9px 8px 7px; border: 1px solid var(--rule); border-radius: 6px; }
.claims li.chosen { border-color: var(--ink-2); }
.claims .dot { width: 12px; height: 12px; margin-top: 3px; border-radius: 50%; border: 1.5px dashed var(--umber); }
.claims .chosen .dot { border: 0; background: var(--ink); }
.claims .y { font: 500 15px/1.3 var(--font-read); }
.claims .why { font: italic 13px/1.4 var(--font-read); color: var(--ink-2); }
.claims .src { font-size: 11px; color: var(--muted); }
.claims button { justify-self: start; margin-top: 4px; border: 1px solid var(--rule); background: var(--bg); border-radius: 5px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
.claims .tag { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
.note { margin: 6px 0 0; font: italic 13px/1.45 var(--font-read); color: var(--ink-2); }
.write label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.write input { width: 100%; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); font: 15px var(--font-read); }
.reads { margin: 8px 0 0; display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 3px 8px; font-size: 12px; }
.reads dt { color: var(--muted); }
.reads dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.reads .bad { grid-column: 1 / -1; color: var(--war); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips button { border: 1px solid var(--rule); background: var(--bg); border-radius: 12px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; color: var(--ink-2); }
.minibar { margin-top: 8px; }
.minibar svg { display: block; width: 100%; height: 34px; }

/* ---------- phone ---------- */
.is-phone .body { grid-template-columns: minmax(0, 1fr); }
.is-phone .main { grid-template-rows: none; display: block; overflow-y: auto; border: 0; }
.is-phone .topbar .hint { display: none; }
.is-phone .tl { overflow: visible; }
.is-phone .mapwrap { height: 300px; }
.is-phone .card { position: absolute; left: 0; right: 0; bottom: 0; max-height: 72%; z-index: 6; border-top: 1px solid var(--rule); border-radius: 14px 14px 0 0; box-shadow: 0 -14px 30px -18px rgb(0 0 0 / .5); padding-top: 22px; animation: rise var(--motion-move) var(--ease); }
.is-phone .card::before { content: ''; position: absolute; top: 7px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--rule); }
.card .close { display: none; }
.is-phone .card .close { display: block; position: absolute; right: 10px; top: 10px; border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.plist { padding: 4px 14px 30px; background: var(--panel); }
.plane { margin-top: 12px; }
.plane h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font: 500 12px var(--font-ui); color: var(--ink-2); }
.plane h3 i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
.prow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; padding: 6px 0 7px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; }
.prow .pt { font: 500 15px/1.3 var(--font-read); }
.prow .pd { font-size: 12px; color: var(--ink-2); }
.prow .pd u { text-decoration: underline dashed var(--umber); text-underline-offset: 3px; }
.prow svg { width: 100%; height: 16px; display: block; }
.empty { font: italic 12.5px var(--font-read); color: var(--muted); margin: 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>

            </div>
          </div>
          <aside class="card" id="card" aria-label="Dates"></aside>
        </div>
      </div>
    </div>
  </main>
</div>

  let x0 = Math.min(pts[0][0], pts[1][0]), x1 = Math.max(pts[0][0], pts[1][0]), y0 = Math.min(pts[0][1], pts[1][1]), y1 = Math.max(pts[0][1], pts[1][1]);
  let w = x1 - x0, h = y1 - y0;
  if (w / h < cw / ch) { const nw = h * cw / ch; x0 -= (nw - w) / 2; w = nw; } else { const nh = w * ch / cw; y0 -= (nh - h) / 2; h = nh; }
  if (w <= GEO.W) x0 = Math.min(Math.max(x0, 0), GEO.W - w);
  if (h <= GEO.H) y0 = Math.min(Math.max(y0, 0), GEO.H - h);
  const k = w / cw, out = [];
  for (let lo = 12; lo <= 30; lo += 1) { const a = P(lo, 42.4), b = P(lo, 34.6); out.push(`<path class="grat" stroke-width="${.7 * k}" d="M${a[0]} ${a[1]}V${b[1]}"/>`); }
  for (let la = 35; la <= 42; la++) { const a = P(12, la), b = P(30.5, la); out.push(`<path class="grat" stroke-width="${.7 * k}" d="M${a[0]} ${a[1]}H${b[0]}"/>`); }
  out.push(`<path class="land" stroke-width="${.8 * k}" d="${GEO.d}"/>`);
  const legend = [];
  const path = (ring) => `M${ring.map((p) => P(...p).join(' ')).join('L')}Z`;
  for (const terr of FUZZY.territories) {
    const st = stateAt(terr, S.year), c = `var(--${terr.color})`;
    if (!st.to) out.push(`<path class="terr" style="--c:${c}" stroke-width="${1.3 * k}" d="${path(st.from.ring)}"/>`);
    else if (S.morph === 'A') {
      // A · cross-fade: the old border fades out as the new one fades in, each drawn whole
      const t = ease(Math.max(0, Math.min(1, st.t)));
      out.push(`<path class="terr" style="--c:${c};opacity:${1 - t}" stroke-width="${1.3 * k}" stroke-dasharray="${4 * k} ${3 * k}" d="${path(st.from.ring)}"/>`);
      out.push(`<path class="terr" style="--c:${c};opacity:${Math.max(.15, t)}" stroke-width="${1.3 * k}" d="${path(st.to.ring)}"/>`);
    } else {
      // B · slow morph: one shape moving between the two over the years it took
      const a = resample(st.from.ring, 72), b = align(a, resample(st.to.ring, 72)), t = ease(Math.max(0, Math.min(1, st.t)));
      out.push(`<path class="terr" style="--c:${c}" stroke-width="${1.3 * k}" d="${path(a.map((p, i) => [p[0] + (b[i][0] - p[0]) * t, p[1] + (b[i][1] - p[1]) * t]))}"/>`);
    }
    const ring = (st.to || st.from).ring, cx = ring.reduce((s, p) => s + p[0], 0) / ring.length, cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
    const [lx, ly] = P(cx, cy);
    out.push(`<text class="tname" x="${lx}" y="${ly + 4 * k}" font-size="${11.5 * k}" stroke-width="${3 * k}" text-anchor="middle">${terr.t.toUpperCase()}</text>`);
    if (st.to) legend.push(`<b>${terr.t}</b> is changing, ${yr(st.to.transition[0])} to ${yr(st.to.transition[1])}: ${st.to.why}.<span class="meter"><i style="width:${Math.round(st.t * 100)}%"></i></span>`);
  }
  svg.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
  svg.innerHTML = out.join('');
  $('legend').innerHTML = legend.length ? legend.join('<br>') : 'No border is changing this year. Drag the year, or Play: Sparta loses Messenia over 371–369 BCE, Macedon grows over 356–338.';
  $('legend').hidden = false;
  $('yr').textContent = yr(S.year);
  $('slider').value = S.year;
}

// ---------- the card ----------
function card() {
  const raw = ALL[S.sel];
  if (!raw) return `<p class="empty">Pick something on the timeline.</p>`;
  const e = current(raw);
  const lanes = (raw.lanes || []).map((l) => `<i style="--l:var(--${l})"></i>${LANE_NAME[l]}`).join(' · ');
  const kind = { event: 'Event', span: 'Period', person: 'Person', polity: 'Polity' }[raw.kind] || 'Era';
  const s = inWords(e.start), en = e.end ? inWords(e.end) : null;
  const startLbl = raw.kind === 'person' ? 'Born' : raw.kind === 'event' ? 'Date' : 'Began';
  const endLbl = raw.kind === 'person' ? 'Died' : 'Ended';
  const blocks = [];
  blocks.push(`<div class="blk"><div class="lbl">When</div><dl class="when"><dt>${startLbl}</dt><dd><div class="big">${s.big}</div>${s.sub ? `<div class="sub">${s.sub}</div>` : ''}</dd>${en && raw.kind !== 'event' ? `<dt>${endLbl}</dt><dd><div class="big">${en.big}</div>${en.sub ? `<div class="sub">${en.sub}</div>` : ''}</dd>` : ''}</dl><div class="minibar">${miniBar(raw)}</div></div>`);
  if (raw.transition?.start) blocks.push(`<div class="blk"><div class="lbl">Took time to begin</div><div class="big" style="font:500 15px var(--font-read)">${yr(raw.transition.start[0])} to ${yr(raw.transition.start[1])}</div><p class="note">${raw.note}</p></div>`);
  if (raw.becomes) blocks.push(`<div class="blk"><div class="lbl">Became</div><div class="big" style="font:500 15px var(--font-read)">The ${raw.becomes.t}, ${yr(raw.becomes.transition[0])} to ${yr(raw.becomes.transition[1])}</div><p class="note">${raw.becomes.why}.</p><p class="note" style="font-style:normal;font-size:12px;color:var(--muted)">One record, so its connections, highlights and borders carry across. Its name follows the year shown.</p></div>`);
  for (const [side, list] of [['start', raw.startClaims], ['end', raw.endClaims]]) {
    if (!list) continue;
    const chosen = S.chosen[`${raw.id}.${side}`] ?? 0;
    blocks.push(`<div class="blk"><div class="lbl">${side === 'start' ? 'Dates given for its beginning' : 'Dates given for its end'}</div><ul class="claims">${list.map((c, i) => `<li class="${i === chosen ? 'chosen' : ''}"><span class="dot"></span><div><div class="y">${c.text ?? yr(c.y)}</div><div class="why">${c.why}</div><div class="src">${c.src}</div>${i === chosen ? '<div class="tag">The one you use</div>' : `<button type="button" data-claim="${side}.${i}">Use this date</button>`}</div></li>`).join('')}</ul></div>`);
  }
  const typed = S.typed ?? (e.start.text || yr(e.start.y));
  blocks.push(`<div class="blk write"><label for="dateIn">${startLbl}: write it as you read it</label><input id="dateIn" value="${typed}" autocomplete="off" spellcheck="false"><dl class="reads" id="reads">${readsHtml(typed)}</dl><div class="chips">${['between 1450 and 1460', 'before 500 BCE', 'by 1200', '11th century', 'late 5th century BCE', '4th millennium BCE', '570s BCE', 'c. 460 BCE'].map((x) => `<button type="button" data-ex="${x}">${x}</button>`).join('')}</div></div>`);
  return `<button class="close" type="button" data-close aria-label="Close">×</button><h2>${raw.t}</h2><p class="kind">${kind}${lanes ? ' · ' + lanes : ''}</p>${blocks.join('')}`;
}
function readsHtml(text) {
  const d = parse(text);
  if (!d) return `<span class="bad">Chronicle can’t read that as a date yet. Try “between 1450 and 1460”, “by 1200” or “late 5th century BCE”.</span>`;
  const b = bounds(d);
  return `<dt>Best guess</dt><dd>${yr(d.y)}</dd>${b.sure ? '' : `<dt>Range</dt><dd>${b.openLo ? 'any time before' : yr(b.lo)} – ${b.openHi ? 'any time after' : yr(b.hi)}</dd>`}<dt>Known to the</dt><dd>${d.part ? d.part + ' ' : ''}${d.precision}</dd>${d.qualifier ? `<dt>Says</dt><dd>${d.qualifier}</dd>` : ''}`;
}
// the record alone on its own scale, drawn the way the timeline draws it
function miniBar(raw) {
  const e = current(raw);
  const sb0 = bounds(e.start), eb = bounds(e.end) ?? sb0;
  const cy = [...(raw.startClaims || []), ...(raw.endClaims || [])].map((c) => c.y);
  const sb = { ...sb0, lo: Math.min(sb0.lo, ...cy) };
  eb.hi = Math.max(eb.hi, ...cy);
  const pad = Math.max(8, (eb.hi - sb.lo) * .12);
  const a = sb.lo - pad, b = Math.max(eb.hi, sb.hi) + pad, W = 320;
  const X = (y) => 8 + ((y - a) / (b - a)) * (W - 16);
  const defs = [], o = { X, defs, xMin: 0, xMax: W, wEnd: b, e, lane: raw.lanes?.[0] || 'politics' };
  const c = raw.lanes ? `var(--${raw.lanes[0]})` : 'var(--strip)';
  let g;
  if (raw.kind === 'event') g = momentSvg({ ...o, top: 6 }) + claimsSvg({ ...o, e: raw }, raw.startClaims, 'start', 14, 12);
  else if (raw.kind === 'person') g = lifeSvg({ ...o, top: 6 });
  else if (raw.becomes) g = stripSvg(raw, 12, { ...o, defs }).replace(/<text[^>]*>[^<]*<\/text>/g, '');
  else g = barSvg({ ...o, top: 7, h: 14, fill: raw.lanes ? `color-mix(in srgb, ${c} 26%, var(--panel))` : 'color-mix(in srgb, var(--umber) 14%, var(--panel))', edge: raw.lanes ? c : 'var(--umber)', wash: false }) + claimsSvg({ ...o, e: raw }, raw.startClaims, 'start', 14, 14) + claimsSvg({ ...o, e: raw }, raw.endClaims, 'end', 14, 14);
  const ticks = [sb.lo, e.start.y, ...(e.end ? [e.end.y, eb.hi] : [])].filter((v, i, arr) => arr.indexOf(v) === i);
  return `<svg viewBox="0 0 ${W} 34" preserveAspectRatio="none" aria-hidden="true"><defs>${defs.join('')}</defs>${g}<text x="${X(e.start.y)}" y="33" font-size="10" fill="var(--muted)" text-anchor="middle">${yr(e.start.y)}</text>${e.end && raw.kind !== 'event' ? `<text x="${Math.min(W - 30, X(e.end.y))}" y="33" font-size="10" fill="var(--muted)" text-anchor="middle">${yr(e.end.y)}</text>` : ''}</svg>`;
}

// ---------- phone: the lanes as a list, dates in words ----------
function phoneList() {
  const rows = LANES.map(([lane, name]) => {
    const items = FUZZY.athens.filter((e) => e.lanes[0] === lane);
    if (!items.length) return `<div class="plane" style="--c:var(--${lane})"><h3><i></i>${name}</h3><p class="empty">Nothing here yet</p></div>`;
    return `<div class="plane" style="--c:var(--${lane})"><h3><i></i>${name}</h3>${items.map((raw) => {
      const e = current(raw), s = inWords(e.start), en = e.end ? inWords(e.end) : null;
      const fuzzy = (d) => d && (d.text && !/^\d+ BCE$/.test(d.text));
      const when = `${fuzzy(e.start) ? `<u>${s.big}</u>` : s.big}${en ? ` – ${fuzzy(e.end) ? `<u>${en.big}</u>` : en.big}` : ''}${raw.startClaims || raw.endClaims ? ' · 2 dates given' : ''}${raw.transition ? ' · took time to begin' : ''}`;
      return `<div class="prow" data-id="${raw.id}" role="button" tabindex="0">${rowBar(raw, lane)}<span class="pt">${raw.t}</span><span class="pd">${when}</span></div>`;
    }).join('')}</div>`;
  });
  return rows.join('');
}

// one row's bar on the timeline's scale, so a phone row shows its fuzzy ends too
function rowBar(raw, lane) {
  const W = 360, X = (y) => 4 + ((y - W0) / (W1 - W0)) * (W - 8), e = current(raw), defs = [];
  const o = { X, defs, xMin: 0, xMax: W, wEnd: W1, e, lane };
  const c = `var(--${lane})`;
  let g;
  if (raw.kind === 'event') g = momentSvg({ ...o, top: 0 }) + claimsSvg({ ...o, e: raw }, raw.startClaims, 'start', 8, 8);
  else if (raw.kind === 'person') g = lifeSvg({ ...o, top: 0 });
  else g = barSvg({ ...o, top: 3, h: 10, fill: `color-mix(in srgb, ${c} 26%, var(--panel))`, edge: c }) + claimsSvg({ ...o, e: raw }, raw.endClaims, 'end', 8, 10);
  return `<svg viewBox="0 0 ${W} 16" preserveAspectRatio="none" aria-hidden="true"><defs>${defs.join('')}</defs><rect x="0" y="7.5" width="${W}" height="1" fill="var(--rule-soft)"/>${g}</svg>`;
}

// ---------- render ----------
const NOTES = () => `<b>Unsure ends</b> ${S.ends === 'A' ? '<b>fade</b>: a record is solid where it surely was and fades over the years it may have been (Archaic Greece’s start, Macedon’s, Thucydides’ birth and his death “after 404”).' : 'get <b>whiskers</b>: the bar runs best guess to best guess with a dashed umber end, and a thin line reaches out to the earliest and latest (an open chevron where it’s “by” or “after”).'} A <b>ramp</b> is different: a start that surely took years, like democracy from Cleisthenes to Ephialtes. <b>Competing dates</b> ${S.claims === 'A' ? 'are ticks: the one you use solid, the others dashed umber with a ring.' : 'show as a count; picking the record opens them into ticks.'} The Delian League <b>became</b> the Athenian Empire ${S.became === 'A' ? 'along a <b>seam</b> where its colour turns.' : 'by a <b>hand-over</b>: one thins as the other thickens.'} On the map, borders change ${S.morph === 'A' ? 'by <b>cross-fading</b> over the years a change took.' : 'by a <b>slow morph</b> over the years a change took.'}<span class="how">Click a record for its dates in words; type a date in the card. Drag the year or Play from 380 BCE.</span>`;
function render() {
  const phone = S.device === 'phone';
  $('app').classList.toggle('is-phone', phone);
  $('device').classList.toggle('phone', phone);
  $('plist').hidden = !phone;
  if (phone) $('plist').innerHTML = phoneList();
  renderTimeline(); renderMap();
  const c = $('card');
  c.hidden = phone && !S.sel;
  c.innerHTML = card();
  $('pnote').innerHTML = NOTES();
}
function pick(id) { S.sel = id; S.typed = null; render(); }

document.addEventListener('click', (ev) => {
  const seg = ev.target.closest('.seg button');
  if (seg) {
    const id = seg.closest('.seg').id, v = seg.dataset.v;
    for (const b of seg.parentNode.children) b.setAttribute('aria-pressed', String(b === seg));
    if (id === 'thm') document.documentElement.dataset.theme = v;
    else S[{ ends: 'ends', claims: 'claims', became: 'became', morph: 'morph', dev: 'device' }[id]] = v;
    if (id === 'dev') S.sel = v === 'phone' ? null : S.sel || 'democracy';
    render(); return;
  }
  const rec = ev.target.closest('.rec[data-id], .prow[data-id]');
  if (rec) { pick(rec.dataset.id); return; }
  const cl = ev.target.closest('[data-claim]');
  if (cl) { const [side, i] = cl.dataset.claim.split('.'); S.chosen[`${S.sel}.${side}`] = +i; render(); return; }
  const ex = ev.target.closest('[data-ex]');
  if (ex) { S.typed = ex.dataset.ex; const inp = $('dateIn'); inp.value = S.typed; $('reads').innerHTML = readsHtml(S.typed); return; }
  if (ev.target.closest('[data-close]')) { S.sel = null; render(); }
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'dateIn') { S.typed = ev.target.value; $('reads').innerHTML = readsHtml(S.typed); }
  if (ev.target.id === 'slider') { S.year = +ev.target.value; stop(); renderMap(); }
});
document.addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('.rec[data-id], .prow[data-id]')) { ev.preventDefault(); pick(ev.target.dataset.id); }
});
let raf = 0;
function stop() { S.playing = false; cancelAnimationFrame(raf); $('play').textContent = 'Play'; }
$('play').addEventListener('click', () => {
  if (S.playing) { stop(); return; }
  S.playing = true; $('play').textContent = 'Pause';
  if (S.year >= bce(330)) S.year = bce(380);
  let last = performance.now();
  const step = (now) => {
    S.year = Math.min(bce(330), S.year + (now - last) / 1000 * 8); last = now; // 8 years a second
    renderMap();
    if (S.year >= bce(330)) { stop(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
});
new ResizeObserver(() => { renderTimeline(); renderMap(); }).observe($('device'));
render();
})();
</script>
