<title>Chronicle how Athens was governed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a quiet desk holding one device (laptop or phone); inside it, Chronicle's own tokens from src/ui/styles.css.
   A polity is political, so its diagram and bar take lapis; patterns carry the form of government. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8; --band: #e2e6df; --band-edge: #c3c9c0;
  --pol: #2f5da8; --umber: #7a5a3a; --slave: #8d969c;
  --font-read: 'Spectral', Georgia, serif;
  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;
  --font-ui: 'Public Sans', system-ui, sans-serif;
  --motion-quick: 150ms; --motion-move: 400ms; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --band: #1e2832; --band-edge: #36444f;
    --pol: #6f93d6; --umber: #b9936b; --slave: #5d676e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --band: #1e2832; --band-edge: #36444f;
  --pol: #6f93d6; --umber: #b9936b; --slave: #5d676e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- prototype chrome (outside the device) ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; letter-spacing: .01em; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-left: auto; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; border: 1px solid var(--band-edge); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--band-edge); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 84ch; min-height: 4.5em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 3px; }
.stage { display: flex; justify-content: center; min-width: 0; }
.device { position: relative; width: min(1240px, 100%); height: 780px; border: 1px solid var(--band-edge); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 82vh; min-height: 640px; border: 1px solid var(--band-edge); border-radius: 12px; }
}

/* ---------- the app inside ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--rule); background: var(--panel); flex: none; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs .glyph { width: 14px; height: 14px; flex: none; color: var(--pol); }
.crumbs .here { font: 600 15px/1 var(--font-sc); letter-spacing: .05em; }
.crumbs .kind { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.views { margin-left: auto; display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; flex: none; }
.views button { border: 0; background: none; padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.views button + button { border-left: 1px solid var(--rule); }
.views button[aria-pressed="true"] { background: var(--rule-soft); color: var(--ink); font-weight: 600; }

.main { position: relative; flex: 1; min-height: 0; display: flex; }
.diag { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dhead { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px 0; }
.dhead .year { font: 500 22px/1.1 var(--font-read); font-variant-numeric: oldstyle-nums; white-space: nowrap; }
.dhead .rname { font: 15px/1.3 var(--font-read); color: var(--ink-2); margin-top: 2px; }
.dhead .rname b { font-weight: 600; color: var(--ink); }
.dhead .nav { margin-left: auto; display: flex; gap: 6px; flex: none; }
.dhead .nav button { border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; padding: 5px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dhead .nav button:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-2); }
.dhead .nav button:disabled { opacity: .45; cursor: default; }
.dbox { position: relative; flex: 1; min-height: 0; }
.dbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* diagram marks */
.n-box { fill: var(--panel); stroke: var(--ink-2); stroke-width: 1.2; }
.n-box.nominal { fill: var(--bg); stroke: var(--rule); }
.n-box.out { fill: color-mix(in srgb, var(--umber) 9%, var(--panel)); stroke: var(--umber); }
.n-name { font: 500 14.5px/1 var(--font-read); fill: var(--ink); }
.n-sub { font: 11px/1 var(--font-ui); fill: var(--muted); }
.nominal .n-name, .n-name.nominal { fill: var(--muted); }
.n-sub.nominal { font-style: italic; }
.n-circ { fill: color-mix(in srgb, var(--pol) 16%, var(--panel)); stroke: var(--pol); stroke-width: 1.3; }
.n-circ.nominal { fill: none; stroke: var(--rule); stroke-width: 1.3; }
.n-circ.out { fill: color-mix(in srgb, var(--umber) 14%, var(--panel)); stroke: var(--umber); }
.n-circ.unknown { fill: none; stroke-dasharray: 4 3; }
.n-halo { fill: color-mix(in srgb, var(--pol) 9%, transparent); stroke: none; }
.lk { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.lk.advises { stroke-width: 1.1; }
.lk.commands { stroke-width: 2.6; }
.lk.checks { stroke: var(--ink); }
.lk-head { fill: var(--ink-2); }
.lk-head.checks { fill: none; stroke: var(--ink); stroke-width: 2; }
.lk-head.advises { fill: none; stroke: var(--ink-2); stroke-width: 1.2; }
.lk-label { font: 11px/1 var(--font-ui); fill: var(--ink-2); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.say-lbl { font: 11px/1 var(--font-ui); fill: var(--ink-2); }
.say-lbl.strong { fill: var(--ink); font-weight: 600; }
.say-head { font: 600 10.5px/1 var(--font-ui); letter-spacing: .08em; fill: var(--muted); text-transform: uppercase; }
.say-unk { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }
.say-unk-t { font: italic 13px/1 var(--font-read); fill: var(--muted); }
[data-node] { cursor: default; }
.lkey { position: absolute; right: 14px; top: 6px; display: grid; gap: 3px; padding: 6px 9px; background: color-mix(in srgb, var(--bg) 88%, transparent); border: 1px solid var(--rule-soft); border-radius: 4px; font-size: 11.5px; color: var(--ink-2); }
.lkey div { display: flex; align-items: center; gap: 7px; white-space: nowrap; }

/* card on the right */
.card { flex: none; width: 340px; border-left: 1px solid var(--rule); background: var(--panel); padding: 16px 18px 18px; overflow-y: auto; }
.card .kind { display: flex; align-items: center; gap: 7px; margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.card h2 { font: 500 22px/1.2 var(--font-read); margin: 0 0 4px; text-wrap: balance; }
.card .meta { margin: 0 0 12px; font: 14px/1.35 var(--font-read); color: var(--ink-2); font-variant-numeric: oldstyle-nums; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.formchip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px 1px 2px; border: 1px solid var(--rule); border-radius: 3px; font: 12px/1.6 var(--font-ui); color: var(--ink); background: var(--bg); }
.formchip svg { flex: none; }
.card h3 { font: 600 11px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 7px; }
.card ul.changes { margin: 0; padding: 0 0 0 16px; font: 14.5px/1.45 var(--font-read); display: grid; gap: 5px; }
.card ul.changes li::marker { color: var(--pol); }
.card blockquote { margin: 0 0 10px; padding: 2px 0 2px 12px; border-left: 2px solid var(--pol); font: 15px/1.5 var(--font-read); }
.card cite { display: block; margin-top: 4px; font: normal 11.5px/1.3 var(--font-ui); color: var(--muted); }
.card .none { margin: 0; font: italic 14px/1.4 var(--font-read); color: var(--muted); }
.card .saytxt { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); }

/* the polity's bar: regimes as patterned segments */
.lane { position: relative; flex: none; height: 58px; display: flex; border-top: 1px solid var(--rule); background: var(--bg); }
.lane-ctl { flex: none; width: 124px; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 10px 0 14px; border-right: 1px solid var(--rule-soft); }
.lane-ctl .lname { display: flex; align-items: center; gap: 6px; font: 600 12px/1 var(--font-sc); letter-spacing: .1em; color: var(--ink-2); }
.lane-ctl .row { display: flex; gap: 5px; }
.lane-ctl button { height: 26px; min-width: 28px; border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; cursor: pointer; display: grid; place-items: center; padding: 0 6px; font-size: 11.5px; color: var(--ink-2); }
.lane-ctl .play { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.track { position: relative; flex: 1; min-width: 0; touch-action: none; cursor: ew-resize; }
.track svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.seg-r { stroke: var(--pol); stroke-width: 1; }
.seg-r.cur { stroke: var(--ink); stroke-width: 2; }
.seg-unrec { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }
.seg-unrec-t { font: italic 12px/1 var(--font-read); fill: var(--muted); }
.client { fill: var(--umber); }
.head line { stroke: var(--ink); stroke-width: 1.5; }
.head circle { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.axis { position: relative; flex: none; height: 24px; margin-left: 124px; border-top: 1px solid var(--rule-soft); background: var(--panel); overflow: hidden; }
.axis span { position: absolute; top: 0; padding-top: 6px; font: 11px/1 var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; transform: translateX(-50%); white-space: nowrap; }
.axis span::before { content: ''; position: absolute; left: 50%; top: 0; height: 4px; border-left: 1px solid var(--rule); }
.forms { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 6px 14px 7px; border-top: 1px solid var(--rule-soft); background: var(--panel); font-size: 11.5px; color: var(--ink-2); }
.forms .hd { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.forms span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tip { position: absolute; z-index: 9; pointer-events: none; padding: 5px 8px; background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.35; border-radius: 3px; white-space: nowrap; }

/* compare: Athens and Sparta in 431 BCE */
.compare { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); padding: 12px 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; align-content: start; }
.compare[hidden] { display: none; }
.cmp-col { min-width: 0; display: flex; flex-direction: column; }
.cmp-col h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cmp-col h2 .pn { font: 600 16px/1.2 var(--font-sc); letter-spacing: .08em; }
.cmp-col h2 .rn { font: 15px/1.3 var(--font-read); color: var(--ink-2); }
.cmp-col .cbox { position: relative; height: 410px; }
.cmp-col .cbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cmp-table { grid-column: 1 / -1; margin-top: 12px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 170px 1fr 1fr; font-size: 13.5px; }
.cmp-table > div { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule-soft); font: 14.5px/1.4 var(--font-read); }
.cmp-table > .rh { font: 12px/1.4 var(--font-ui); color: var(--muted); padding-top: 10px; }
.cmp-table > .ch { font: 600 11px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 12px; }

/* phone: one column that scrolls */
.is-phone .main { flex-direction: column; overflow-y: auto; }
.is-phone .diag { flex: none; }
.is-phone .dhead { flex-wrap: wrap; padding: 10px 12px 0; }
.is-phone .dhead .year { font-size: 19px; }
.is-phone .dhead .nav { margin-left: 0; width: 100%; }
.is-phone .dhead .nav button { flex: 1; max-width: none; }
.is-phone .dbox { flex: none; height: 430px; }
.is-phone .lkey { display: none; }
.is-phone .card { width: auto; border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
.is-phone .crumbs .kind { display: none; }
.is-phone .views button { padding: 5px 8px; font-size: 12px; }
.is-phone .lane-ctl { width: 92px; padding: 0 6px 0 10px; }
.is-phone .lane-ctl .lname { display: none; }
.is-phone .axis { margin-left: 92px; }
.is-phone .forms { gap: 3px 12px; padding: 6px 10px; }
.is-phone .forms .hd { width: 100%; }
.is-phone .compare { grid-template-columns: 1fr; padding: 10px 12px 20px; }
.is-phone .cmp-col .cbox { height: 380px; }
.is-phone .cmp-table { grid-template-columns: 1fr 1fr; }
.is-phone .cmp-table > .rh { grid-column: 1 / -1; padding-bottom: 0; border-bottom: 0; }
.is-phone .cmp-table > .ch:first-child { display: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="f-democracy" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="color-mix(in srgb, var(--pol) 12%, var(--panel))"/><circle cx="3" cy="3" r="1.25" fill="var(--pol)"/></pattern>
    <pattern id="f-oligarchy" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="color-mix(in srgb, var(--pol) 12%, var(--panel))"/><rect width="2" height="6" fill="var(--pol)"/></pattern>
    <pattern id="f-timocracy" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="color-mix(in srgb, var(--pol) 12%, var(--panel))"/><rect y="2" width="6" height="2" fill="var(--pol)"/></pattern>
    <pattern id="f-tyranny" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="var(--pol)"/></pattern>
  </defs>
</svg>

<div class="proto">
  <header class="pbar">
    <h1>How Athens was governed <span>Phase 0 prototype · sample data</span></h1>
    <div class="controls">
      <fieldset class="seg" id="vd"><legend>Diagram</legend><span class="opts"><button data-v="A" aria-pressed="false">A · Chart</button><button data-v="B" aria-pressed="true">B · Bodies</button></span></fieldset>
      <fieldset class="seg device-seg" id="dev"><legend>Device</legend><span class="opts"><button data-v="laptop" aria-pressed="true">Laptop</button><button data-v="phone" aria-pressed="false">Phone</button></span></fieldset>
      <fieldset class="seg" id="thm"><legend>Theme</legend><span class="opts"><button data-v="light" aria-pressed="false">Light</button><button data-v="dark" aria-pressed="false">Dark</button></span></fieldset>
    </div>
  </header>
  <p class="pnote" id="pnote"></p>
  <main class="stage">
    <div class="device" id="device">
      <div class="app" id="app">
        <div class="topbar">
          <div class="crumbs"><svg class="glyph" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="12" height="12" fill="currentColor"/></svg><span class="here">Athens</span><span class="kind">Polity</span></div>
          <div class="views" role="group" aria-label="View"><button id="vTime" type="button" aria-pressed="true">Through time</button><button id="vCmp" type="button" aria-pressed="false">With Sparta, 431 BCE</button></div>
        </div>
        <div class="main" id="main">
          <section class="diag" id="diag">
            <div class="dhead">
              <div><div class="year" id="year"></div><div class="rname" id="rname"></div></div>
              <div class="nav"><button id="prev" type="button"></button><button id="next" type="button"></button></div>
            </div>
            <div class="dbox" id="dbox"><svg id="dsvg" role="img" aria-label="How Athens was governed at this year"></svg><div class="lkey" id="lkey"></div></div>

            <div class="row"><button id="play" class="play" type="button" aria-label="Play"></button><button id="speed" type="button" title="Speed">1×</button></div>
          </div>
          <div class="track" id="track"><svg id="tsvg"></svg></div>
        </div>
        <div class="axis" id="axis"></div>
        <div class="forms" id="forms"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// ---------- dates: astronomical years, as in src/model/dates.ts (431 BCE = -430) ----------
const bce = n => 1 - n;
const t = (y, f) => 1 - y + f;
const yr = T => { const a = Math.floor(T); return a <= 0 ? `${1 - a} BCE` : `${a} CE`; };
const span = (a, b) => { const A = 1 - Math.floor(a), B = 1 - Math.floor(b - 1e-6); return A === B ? `${A} BCE` : `${A}–${B} BCE`; };
const fmtN = n => n.toLocaleString('en-US');

// ---------- institutions: where each sits in the diagram (tier 0 offices, 1 councils and courts, 2 assemblies) ----------
const INST = {
  archons: { name: 'Archons', tier: 0, slot: .3, gk: 'archontes' },
  generals: { name: 'Generals', tier: 0, slot: .64, gk: 'strategoi' },
  tyrant: { name: 'Tyrant', tier: 0, slot: .5, gk: 'tyrannos' },
  thirty: { name: 'The Thirty', tier: 0, slot: .5 },
  eleven: { name: 'The Eleven', tier: 0, slot: .18 },
  kings: { name: 'Two kings', tier: 0, slot: .3, gk: 'basileis' },
  ephors: { name: 'Ephors', tier: 0, slot: .68, gk: 'ephoroi' },
  areopagus: { name: 'Areopagus', tier: 1, slot: .12, gk: 'Areios Pagos' },
  council: { name: 'Council', tier: 1, slot: .42, gk: 'boule' },
  four: { name: 'The Four Hundred', short: 'The 400', tier: 1, slot: .42 },
  courts: { name: "People's courts", short: 'Courts', tier: 1, slot: .7, gk: 'dikasteria' },
  lawmakers: { name: 'Lawmakers', tier: 1, slot: .94, gk: 'nomothetai' },
  gerousia: { name: 'Elders', tier: 1, slot: .42, gk: 'gerousia' },
  assembly: { name: 'Assembly', tier: 2, slot: .5, gk: 'ekklesia' },
  fivek: { name: 'The Five Thousand', short: 'The 5,000', tier: 2, slot: .5 },
  threek: { name: 'The Three Thousand', short: 'The 3,000', tier: 2, slot: .5 },
  apella: { name: 'Assembly', tier: 2, slot: .5, gk: 'apella' },
  sparta: { name: 'Spartan garrison', short: 'Spartans', tier: 0, slot: 1, out: true },
