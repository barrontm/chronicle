<style>
/* Layout: a quiet desk holding one device (laptop or phone); inside it, Athens open at level 1 with its six lanes, and the
   connections between lanes drawn as arrows (A) or counted in a grid that opens into arrows (B). Tokens are Chronicle's. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8;
  --band: #e6e9e2; --band-edge: #c3c9c0; --sea: #dfe6e6;
  --politics: #2f5da8; --war: #c23b22; --economy: #b8860b; --ideas: #4b3f8c; --technology: #2e8b74; --nature: #6b7a32; --umber: #7a5a3a;
  --mark: #f3e3a3;
  --halo: #eef0ec;
  --font-read: 'Spectral', Georgia, serif;
  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;
  --font-ui: 'Public Sans', system-ui, sans-serif;
  --motion-quick: 150ms; --motion-move: 400ms; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
    --band: #18212a; --band-edge: #36444f; --sea: #0f171e;
    --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
    --mark: #5a4a17;
    --halo: #131b23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
  --band: #18212a; --band-edge: #36444f; --sea: #0f171e;
  --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
  --mark: #5a4a17;
  --halo: #131b23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- prototype chrome (outside the device) ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; letter-spacing: .01em; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; border: 1px solid var(--band-edge); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--band-edge); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.steps .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; }
.steps button { border: 1px solid var(--band-edge); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.steps button:hover { color: var(--ink); border-color: var(--ink-2); }
.steps button[aria-current="step"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 86ch; min-height: 3em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 2px; }
.stage { display: flex; justify-content: center; min-width: 0; }

.device { position: relative; width: min(1240px, 100%); height: 760px; border: 1px solid var(--band-edge); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 86vh; min-height: 640px; border: 1px solid var(--band-edge); border-radius: 12px; }
}

/* ---------- the app inside ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-bottom: 1px solid var(--rule); background: var(--panel); flex: none; }
.crumbs { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 1; font: 15px/1 var(--font-read); white-space: nowrap; overflow: hidden; }
.crumbs .up { color: var(--ink-2); }
.crumbs .here { font: 600 15px/1 var(--font-sc); letter-spacing: .05em; color: var(--ink); }
.crumbs .sep { color: var(--muted); }
.crumbs .yrs { font-size: 13px; color: var(--muted); font-variant-numeric: oldstyle-nums; margin-left: 6px; }
.iconbtn { border: 1px solid var(--rule); background: none; border-radius: 6px; height: 28px; padding: 0 9px; cursor: pointer; color: var(--ink-2); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.iconbtn:hover { color: var(--ink); border-color: var(--ink-2); }
.iconbtn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.iconbtn svg { width: 14px; height: 14px; }

.mapwrap { position: relative; flex: none; height: 96px; border-bottom: 1px solid var(--rule); background: var(--sea); overflow: hidden; }
.phone .mapwrap { height: 120px; }
.mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapwrap .say { position: absolute; left: 10px; bottom: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; font: 12.5px/1.35 var(--font-read); color: var(--ink-2); }

.tl { position: relative; flex: 1; min-height: 0; display: flex; }
.tlmain { position: relative; flex: 1; min-width: 0; overflow: auto; }
.tlmain svg { display: block; }
.side { flex: none; width: 420px; border-left: 1px solid var(--rule); background: var(--panel); overflow: auto; }

/* SVG text */
.t-axis { font: 400 10.5px var(--font-ui); fill: var(--muted); font-variant-numeric: tabular-nums; }
.t-lane { font: 500 11.5px var(--font-ui); fill: var(--ink); }
.t-lane-n { font: 400 11px var(--font-ui); fill: var(--muted); }
.t-mom { font: 400 11px var(--font-ui); fill: var(--ink); }
.t-span { font: 400 12px var(--font-read); fill: var(--ink); }
.t-eff { font: 600 10.5px var(--font-ui); fill: var(--ink); letter-spacing: .01em; }
.halo { paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; stroke-linejoin: round; }
.fadeable { transition: opacity var(--motion-quick) var(--ease); }
.faded { opacity: .16; }
.dim { opacity: .38; }
[data-conn], [data-entry], [data-cell] { cursor: pointer; }
.pairchip { position: sticky; left: 0; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 12px; color: var(--ink-2); background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--rule-soft); }
.pairchip button { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
.sq { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: 0; }

/* ---------- the card: a connection or an entry ---------- */
.card { position: absolute; z-index: 5; right: 12px; top: 12px; width: 344px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 14px 40px -18px rgb(0 0 0 / .45); padding: 14px 16px 16px; display: grid; gap: 12px; }
.phone .card { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 72%; border-radius: 14px 14px 0 0; border-bottom: 0; }
.card .close { position: absolute; right: 8px; top: 8px; border: 0; background: var(--rule-soft); border-radius: 999px; width: 24px; height: 24px; cursor: pointer; line-height: 1; color: var(--ink-2); }
.card .lanes { font-size: 11.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card h2 { margin: 0; padding-right: 26px; font: 500 18px/1.3 var(--font-read); text-wrap: balance; }
.card h2 em { font-style: italic; color: var(--ink-2); }
.card .dates { font: 13px var(--font-read); color: var(--muted); font-variant-numeric: oldstyle-nums; }
.card .note { margin: 0; font: italic 14px/1.45 var(--font-read); color: var(--ink-2); }
.card h3 { margin: 0; font: 600 10.5px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ev { display: grid; gap: 10px; }
.ev blockquote { margin: 0; padding: 2px 0 2px 10px; border-left: 2px solid var(--rule); font: 14.5px/1.5 var(--font-read); }
.ev blockquote mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }
.ev .src { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-top: 4px; font: 11.5px var(--font-ui); color: var(--muted); }
.ev .src button { border: 0; background: none; padding: 0; color: var(--focus); cursor: pointer; font-size: 12px; white-space: nowrap; }
.none { font: italic 13.5px var(--font-read); color: var(--muted); margin: 0; }
.vocab { display: flex; flex-wrap: wrap; gap: 5px; }
.vocab span { border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--ink-2); }
.vocab span.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.vocab span.add { border-style: dashed; color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts button { border: 1px solid var(--rule); background: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.acts button:hover { border-color: var(--ink-2); color: var(--ink); }
.effs { display: grid; gap: 4px; }
.effs button { display: flex; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; font: 14px/1.35 var(--font-read); }
.effs button:hover { background: var(--rule-soft); }
.effs .k { font: 600 12px var(--font-ui); color: var(--ink-2); flex: none; min-width: 9.5ch; }

/* ---------- B: the grid ---------- */
.grid { padding: 14px 16px 18px; display: grid; gap: 10px; }
.grid h2 { margin: 0; font: 500 16px/1.3 var(--font-read); }
.grid .lede { margin: 0; font: 13.5px/1.45 var(--font-read); color: var(--ink-2); }
.grid table { border-collapse: separate; border-spacing: 3px; width: 100%; table-layout: fixed; }
.grid th { font: 500 10.5px/1.15 var(--font-ui); color: var(--ink-2); padding: 0 0 2px; vertical-align: bottom; }
.grid th.row { text-align: right; padding-right: 6px; width: 92px; vertical-align: middle; font-size: 11px; }
.grid thead th .sq { display: block; margin: 0 auto 3px; }
.grid td { height: 46px; border-radius: 5px; text-align: center; padding: 0; }
.grid td button { width: 100%; height: 100%; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; display: grid; place-content: center; gap: 1px; }
.grid td button:hover { border-color: var(--ink-2); }
.grid td button[aria-pressed="true"] { border: 2px solid var(--ink); }
.grid td .n { font: 600 15px/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.grid thead th { font-size: 10px; overflow-wrap: anywhere; }
.grid td.zero { color: var(--muted); }
.grid td.same { background: repeating-linear-gradient(135deg, var(--rule-soft) 0 3px, transparent 3px 7px); }
.grid .axislbl { font: 11px var(--font-ui); color: var(--muted); }
.grid .sum { margin: 0; font: 13.5px/1.45 var(--font-read); }

/* ---------- phone: level 1 as a list, with arcs in the gutter ---------- */
.plist { position: relative; padding: 6px 12px 40px 44px; }
.plist .arcs { position: absolute; left: 0; top: 0; width: 46px; pointer-events: none; overflow: visible; }
.plane { margin-top: 10px; }
.plane > header { display: flex; align-items: center; gap: 7px; padding: 6px 0 4px; border-bottom: 1px solid var(--rule-soft); font: 500 12.5px var(--font-ui); }
.plane > header .n { color: var(--muted); font-weight: 400; }
.prow { padding: 6px 0 4px; border-bottom: 1px solid var(--rule-soft); }
.prow .ttl { display: flex; gap: 8px; align-items: baseline; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; width: 100%; }
.prow .yr { font: 12.5px var(--font-read); color: var(--muted); font-variant-numeric: oldstyle-nums tabular-nums; min-width: 4.4ch; flex: none; }
.prow .t { font: 14px/1.3 var(--font-read); }
.prow .more { font: 12px var(--font-ui); color: var(--muted); }
.peff { display: flex; gap: 6px; align-items: baseline; margin: 3px 0 0 calc(4.4ch + 8px); border: 0; background: none; padding: 2px 0; cursor: pointer; text-align: left; font: 13px/1.3 var(--font-read); color: var(--ink-2); }
.peff .k { font: 600 11.5px var(--font-ui); color: var(--ink); }
.peff .sq { flex: none; align-self: center; }
.phone .grid { padding: 12px 12px 6px; }
.phone .grid th.row { width: 70px; }
.phone .grid td { height: 40px; }
</style>

      if (g.kind === 'm') out.push(`<circle cx="${g.x}" cy="${n.cy}" r="3.6" fill="${col}" stroke="var(--panel)" stroke-width="1"/>`);

// ---------- the card ----------

function cardHtml() {

// ---------- B: the grid ----------

    }

// ---------- phone: level 1 as a list, arcs in the gutter ----------
function phoneList() {

function drawArcs() {

  const gridBtn = `<button class="iconbtn" type="button" data-view="${st.view === 'B' ? 'A' : 'B'}" aria-pressed="${st.view === 'B'}"><svg viewBox="0 0 14 14" aria-hidden="true"><g fill="currentColor">${[0, 5, 10].flatMap((x) => [0, 5, 10].map((y) => `<rect x="${x}" y="${y}" width="4" height="4" rx="1"/>`)).join('')}</g></svg>What drove what</button>`;
  app.innerHTML = `
    <div class="topbar"><div class="crumbs"><span class="up">Overview</span><span class="sep">›</span><span class="here">Athens</span>${phone ? '' : '<span class="yrs">500–400 BCE</span>'}</div>${gridBtn}</div>
    <div class="mapwrap"><span class="say">The map, unchanged: influences between lanes add nothing to it.</span></div>
    <div class="tl">${phone ? `<div class="tlmain">${st.view === 'B' ? gridHtml(true) : ''}${phoneList()}</div>` : `<div class="tlmain">${pairChip}<div id="svgwrap"></div></div>${st.view === 'B' ? `<div class="side">${gridHtml(false)}</div>` : ''}`}${cardHtml()}</div>`;

// ---------- events ----------
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, [data-conn], [data-entry], [data-cell]');
  if (!t) return;
  const d = t.dataset;
  if (d.view) { st.view = d.view; st.sel = null; if (st.view === 'A') st.pair = null; st.step = st.view === 'A' ? 1 : 4; }
  else if (d.device) st.device = d.device;
  else if (d.themeBtn) { st.theme = d.themeBtn; try { localStorage.setItem('influences-proto', JSON.stringify({ theme: st.theme })); } catch {} }
  else if (d.step) return setStep(+d.step);
  else if (d.case) { st.case = d.case; st.sel = null; st.hover = null; if (st.view === 'B') st.view = 'A'; }
  else if (d.close !== undefined) st.sel = null;

  else if (d.cell) { const [a, b] = d.cell.split('>'); st.pair = st.pair && st.pair[0] === a && st.pair[1] === b ? null : [a, b]; st.sel = null; }

});

});
let hoverT = null;

  for (const g of document.querySelectorAll('#svgwrap [data-conn]')) g.classList.toggle('faded', !!fs && !fs.has(g.dataset.conn));
  for (const g of document.querySelectorAll('#svgwrap [data-entry]')) g.classList.toggle('dim', !!ends && !ends.has(g.dataset.entry));
}
addEventListener('resize', () => render());
document.fonts?.ready.then(render);
render();
</script>
