<title>Chronicle war on the map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a quiet desk holding one device (laptop or phone); inside it, Chronicle's own tokens from src/ui/styles.css.
   Sides take their alliance's colour: Delian League lapis, Peloponnesian League cinnabar. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8; --band: #e2e6df; --band-edge: #c3c9c0;
  --umber: #7a5a3a;
  --map-water: #c9d6d8; --map-land: #ece4cf; --map-border: #a9a48f; --grat: #b7c6c9;
  --ath: #2f5da8; --spa: #c23b22;
  --font-read: 'Spectral', Georgia, serif;
  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;
  --font-ui: 'Public Sans', system-ui, sans-serif;
  --motion-quick: 150ms; --motion-move: 400ms; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --band: #1e2832; --band-edge: #36444f;
    --umber: #b9936b;
    --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
    --ath: #6f93d6; --spa: #e0664c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --band: #1e2832; --band-edge: #36444f;
  --umber: #b9936b;
  --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
  --ath: #6f93d6; --spa: #e0664c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- prototype chrome (outside the device) ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; letter-spacing: .01em; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-left: auto; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; border: 1px solid var(--band-edge); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--band-edge); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 84ch; min-height: 4.5em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 3px; }
.stage { display: flex; justify-content: center; min-width: 0; }
.device { position: relative; width: min(1240px, 100%); height: 760px; border: 1px solid var(--band-edge); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 82vh; min-height: 640px; border: 1px solid var(--band-edge); border-radius: 12px; }
}

/* ---------- the app inside ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--rule); background: var(--panel); flex: none; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs .glyph { width: 18px; height: 18px; color: var(--ink-2); flex: none; }
.crumbs .here { font: 600 15px/1 var(--font-sc); letter-spacing: .05em; }
.crumbs .cd { font: 13px/1 var(--font-read); color: var(--muted); font-variant-numeric: oldstyle-nums; }
.crumbs .kind { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.topbar .sides { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.sides span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 1px; background: var(--c); flex: none; }

.mapbox { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--map-water); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.mapbox.dragging { cursor: grabbing; }
.mapbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.land { fill: var(--map-land); stroke: var(--map-border); stroke-width: .8; vector-effect: non-scaling-stroke; }
.grat { stroke: var(--grat); fill: none; stroke-width: .8; vector-effect: non-scaling-stroke; }
.region { font: 500 12px/1 var(--font-sc); letter-spacing: .2em; fill: var(--muted); }
.city { font: 13px/1 var(--font-read); fill: var(--ink); paint-order: stroke; stroke: var(--map-land); stroke-width: 3px; stroke-linejoin: round; }
.blabel { font: 500 11.5px/1 var(--font-ui); fill: var(--ink); paint-order: stroke; stroke: var(--map-land); stroke-width: 3px; stroke-linejoin: round; }
.blabel.old { fill: var(--ink-2); font-weight: 400; }
.rlabel { font: italic 13px/1 var(--font-read); fill: var(--ink); paint-order: stroke; stroke: var(--map-water); stroke-width: 3.5px; stroke-linejoin: round; }
.rlabel tspan.n { font: normal 11px var(--font-ui); fill: var(--ink-2); }
[data-hit] { cursor: pointer; }

.when { position: absolute; left: 14px; top: 12px; padding: 8px 12px 9px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 4px; pointer-events: none; max-width: calc(100% - 28px); }
.when .season { font: 500 21px/1.1 var(--font-read); font-variant-numeric: oldstyle-nums; white-space: nowrap; }
.when .wy { margin-top: 3px; font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mapctl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--panel); }
.mapctl button { width: 32px; height: 30px; border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; color: var(--ink-2); }
.mapctl button + button { border-top: 1px solid var(--rule); }
.mapctl button:hover { background: var(--rule-soft); color: var(--ink); }
.mapctl .fit { font-size: 10.5px; letter-spacing: .02em; }
.key { position: absolute; right: 12px; bottom: 12px; padding: 8px 11px; display: grid; gap: 5px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--rule); border-radius: 4px; font-size: 12px; color: var(--ink-2); }
.key div { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.key svg { flex: none; overflow: visible; }
.key .scale { display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 8px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.key .scale i { display: block; width: 34px; background: var(--ink-2); border-radius: 1px; }
.key .hd { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }
.keybtn { display: none; position: absolute; left: 12px; bottom: 12px; border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
.tip { position: absolute; z-index: 9; pointer-events: none; padding: 5px 8px; background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.35; border-radius: 3px; white-space: nowrap; max-width: 300px; }
.tip b { font-weight: 600; }

/* the war's own bar: phases, battle ticks, playhead */
.lane { position: relative; flex: none; height: 64px; display: flex; border-top: 1px solid var(--rule); background: var(--bg); }
.lane-ctl { flex: none; width: 124px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px; border-right: 1px solid var(--rule-soft); background: var(--bg); }
.lane-ctl button { height: 32px; min-width: 32px; border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; cursor: pointer; display: grid; place-items: center; padding: 0 6px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lane-ctl button:hover { color: var(--ink); border-color: var(--ink-2); }
.lane-ctl .play { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 36px; }
.lane-ctl .play:hover { color: var(--panel); }
.track { position: relative; flex: 1; min-width: 0; touch-action: none; cursor: ew-resize; }
.track svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.phase rect { fill: color-mix(in srgb, var(--ink) 11%, var(--panel)); }
.phase.peace rect { fill: color-mix(in srgb, var(--ink) 4%, var(--panel)); }
.phase.now rect { fill: color-mix(in srgb, var(--ink) 18%, var(--panel)); }
.phase text { font: 12.5px/1 var(--font-read); fill: var(--ink); }
.phase.peace text { font-style: italic; fill: var(--ink-2); }
.tick { stroke-width: 2; }
.tick.future { opacity: .45; }
.tickhit { stroke: transparent; stroke-width: 12; cursor: pointer; }
.head line { stroke: var(--ink); stroke-width: 1.5; }
.head circle { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.axis { position: relative; flex: none; height: 26px; margin-left: 124px; border-top: 1px solid var(--rule-soft); background: var(--panel); overflow: hidden; }
.axis span { position: absolute; top: 0; padding-top: 7px; font: 11px/1 var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; transform: translateX(-50%); white-space: nowrap; }
.axis span::before { content: ''; position: absolute; left: 50%; top: 0; height: 4px; border-left: 1px solid var(--rule); }
.axis i { position: absolute; top: 0; height: 3px; border-left: 1px solid var(--rule-soft); }

/* detail card: side panel on the laptop, bottom sheet on the phone */
.card { position: absolute; top: 12px; right: 56px; width: 330px; max-height: calc(100% - 24px); overflow-y: auto; z-index: 6; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 16px 36px -22px rgb(0 0 0 / .45); padding: 16px 18px 16px; opacity: 0; transform: translateY(-6px); visibility: hidden; transition: opacity var(--motion-quick), transform var(--motion-move) var(--ease), visibility 0s linear var(--motion-move); }
.card.open { opacity: 1; transform: none; visibility: visible; transition: opacity var(--motion-quick), transform var(--motion-move) var(--ease), visibility 0s; }
.card .close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 4px; }
.card .close:hover { background: var(--rule-soft); color: var(--ink); }
.card .kind { display: flex; align-items: center; gap: 7px; margin: 0 30px 6px 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.card .kind svg { width: 16px; height: 16px; color: var(--c); flex: none; }
.card h2 { font: 500 21px/1.2 var(--font-read); margin: 0 30px 4px 0; text-wrap: balance; }
.card .meta { margin: 0 0 10px; font: 14px/1.35 var(--font-read); color: var(--ink-2); font-variant-numeric: oldstyle-nums; }
.card .facts { display: grid; grid-template-columns: 74px 1fr; gap: 5px 10px; margin: 0 0 12px; font-size: 13px; }
.card .facts dt { color: var(--muted); }
.card .facts dd { margin: 0; color: var(--ink); }
.card .facts dd .sw { margin-right: 6px; vertical-align: -1px; }
.card .facts .range { color: var(--ink-2); }
.card blockquote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 2px solid var(--c); font: 15.5px/1.5 var(--font-read); }
.card cite { display: block; margin-top: 4px; font: normal 11.5px/1.3 var(--font-ui); color: var(--muted); }
.card .none { margin: 0 0 12px; font: italic 14px/1.4 var(--font-read); color: var(--muted); }
.card .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.card .actions button { border: 1px solid var(--rule); background: var(--bg); padding: 6px 11px; border-radius: 4px; font-size: 12.5px; cursor: pointer; }
.card .actions button:disabled { color: var(--muted); cursor: default; }

/* phone */
.is-phone .topbar .sides, .is-phone .crumbs .kind { display: none; }
.is-phone .when { left: 10px; top: 10px; padding: 6px 9px 7px; }
.is-phone .when .season { font-size: 18px; }
.is-phone .when .wy { font-size: 11.5px; }
.is-phone .mapctl { right: 10px; top: 10px; }
.is-phone .key { display: none; left: 10px; right: auto; bottom: 48px; }
.is-phone .key.show { display: grid; }
.is-phone .keybtn { display: block; }
.is-phone .lane-ctl { width: 92px; padding: 0 6px 0 10px; gap: 4px; }
.is-phone .lane-ctl #restart { display: none; }
.is-phone .axis { margin-left: 92px; }
.is-phone .phase text { display: none; }
.is-phone .card { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; border-radius: 14px 14px 0 0; border-width: 1px 0 0; padding-top: 22px; transform: translateY(105%); opacity: 1; }
.is-phone .card.open { transform: none; }
.is-phone .card::before { content: ''; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--rule); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>

<div class="proto">
  <header class="pbar">
    <h1>War on the map <span>Phase 0 prototype · sample data</span></h1>
    <div class="controls">
      <fieldset class="seg" id="vr"><legend>Routes</legend><span class="opts"><button data-v="A" aria-pressed="true">A · Lines</button><button data-v="B" aria-pressed="false">B · Minard</button></span></fieldset>
      <fieldset class="seg" id="vp"><legend>Playback</legend><span class="opts"><button data-v="A" aria-pressed="true">A · Steady</button><button data-v="B" aria-pressed="false">B · Guided</button></span></fieldset>
      <fieldset class="seg device-seg" id="dev"><legend>Device</legend><span class="opts"><button data-v="laptop" aria-pressed="true">Laptop</button><button data-v="phone" aria-pressed="false">Phone</button></span></fieldset>
      <fieldset class="seg" id="thm"><legend>Theme</legend><span class="opts"><button data-v="light" aria-pressed="false">Light</button><button data-v="dark" aria-pressed="false">Dark</button></span></fieldset>
    </div>
  </header>
  <p class="pnote" id="pnote"></p>
  <main class="stage">
    <div class="device" id="device">
      <div class="app" id="app">
        <div class="topbar">
          <div class="crumbs">
            <svg class="glyph" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="6" width="15" height="6" rx="1" fill="currentColor" opacity=".35"/><path d="M6 3.5v11M12 3.5v11" stroke="currentColor" stroke-width="1.8"/></svg>
            <span class="here">Peloponnesian War</span><span class="cd">431–404 BCE</span><span class="kind">War</span>
          </div>
          <div class="sides"><span><i class="sw" style="--c:var(--ath)"></i>Athens and allies</span><span><i class="sw" style="--c:var(--spa)"></i>Sparta and allies</span></div>
        </div>

          <svg id="ov" role="img" aria-label="Map of the war at the current year"></svg>
          <div class="when" aria-live="polite"><div class="season" id="season"></div><div class="wy" id="wy"></div></div>
          <div class="mapctl"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button><button id="zfit" class="fit" type="button" title="Show the whole war, Sicily to the Hellespont">All</button></div>

          <div class="lane-ctl">
            <button id="restart" type="button" aria-label="Back to the start" title="Back to the start (Home)"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.5v9M10.5 1.5L4 6l6.5 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
            <button id="play" class="play" type="button" aria-label="Play"></button>
            <button id="speed" type="button" title="Speed">1×</button>
          </div>
          <div class="track" id="track"><svg id="tsvg"></svg></div>
        </div>
        <div class="axis" id="axis"></div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------- dates: astronomical years, as in src/model/dates.ts (431 BCE = -430); f = season within the year ----------
const t = (y, f) => 1 - y + f;
function shortPair(a, b) { const x = String(a), y = String(b); if (x.length !== y.length) return y; let i = 0; while (i < x.length && x[i] === y[i]) i++; return y.slice(i); }
// Thucydides counts the war in summers and winters: summer runs from about March to October.
function seasonOf(T) {
  const a = Math.floor(T), f = T - a, Y = 1 - a;
  if (f >= .2 && f < .8) return `Summer of ${Y} BCE`;
  if (f >= .8) return `Winter of ${Y}/${shortPair(Y, Y - 1)} BCE`;
  return `Winter of ${Y + 1}/${shortPair(Y + 1, Y)} BCE`;

function render(now) {

  const mb = mapbox.getBoundingClientRect();
  for (const el of mapbox.querySelectorAll('.when, .mapctl, .key, .keybtn')) { const r = el.getBoundingClientRect(); if (r.width) taken.push([r.left - mb.left - 4, r.top - mb.top - 4, r.right - mb.left + 4, r.bottom - mb.top + 4]); }

    const font = `${ph.peace ? 'italic ' : ''}12.5px Spectral`;
    const label = [ph.name, ph.short].find(n => n && textW(n, font) + 12 < b - a - 2);
    o.push(`<g class="phase${ph.peace ? ' peace' : ''}${now ? ' now' : ''}" data-phase="${ph.name}"><title>${ph.name}</title><rect x="${(a + 1).toFixed(1)}" y="${y0}" width="${Math.max(0, b - a - 2).toFixed(1)}" height="${h}" rx="2"/>${label ? `<text x="${(a + 7).toFixed(1)}" y="${y0 + 13}">${label}</text>` : ''}</g>`);
  }
  for (const b of BATTLES) {
    const x = tx(b.t).toFixed(1), fut = T < b.t;
    o.push(`<line class="tick${fut ? ' future' : ''}" x1="${x}" x2="${x}" y1="${y0 - 7}" y2="${y0 + h + 7}" stroke="var(--${b.win})"/><line class="tickhit" data-hit="${b.id}" x1="${x}" x2="${x}" y1="${y0 - 10}" y2="${y0 + h + 10}"/>`);
  }
  const hx = tx(T).toFixed(1);
  o.push(`<g class="head"><line x1="${hx}" x2="${hx}" y1="4" y2="60"/><circle cx="${hx}" cy="8" r="5"/></g>`);
  tsvg.innerHTML = o.join('');
}
function renderAxis() {
  const ax = $('#axis'), o = [];
  for (let Y = 431; Y >= 404; Y--) {
    const x = tx(t(Y, .5));
    if (Y % 5 === 0 || Y === 431 || Y === 404) { if (Y === 430 || Y === 405) continue; o.push(`<span style="left:${x.toFixed(1)}px${x > track.clientWidth - 16 ? ';transform:translateX(-80%)' : ''}">${Y}</span>`); }
    else o.push(`<i style="left:${x.toFixed(1)}px"></i>`);
  }
  ax.innerHTML = o.join('');
}
function syncWhen() {
  const T = S.T;
  $('#season').textContent = seasonOf(T);
  const n = Math.min(27, Math.floor(T - t(431, .2)) + 1);
  const ph = PHASES.find(p => T >= p.from && T < p.to);
  $('#wy').textContent = T < t(431, .2) ? 'The war is about to begin' : T >= t(404, .3) ? 'Athens has surrendered' : `Year ${n} of 27${ph ? ` · ${ph.name}` : ''}`;
}

// ---------- clock ----------
let raf = 0, lastNow = 0;
const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
const BASE_RATE = .7; // years per second at 1×
function setT(T, fromPlay) {
  const prev = S.T; S.T = Math.min(T_END, Math.max(T_START, T));
  if (S.T > prev && S.T - prev < 1.2 && !reduced.matches) for (const b of BATTLES) if (b.t > prev && b.t <= S.T) pulses.push({ b, t0: performance.now() });
  if (!fromPlay) kick();
}
function frame(now) {
  raf = 0;
  const dt = Math.min(100, lastNow ? now - lastNow : 16); lastNow = now;
  if (S.playing) {
    let target = BASE_RATE * S.speed;
    if (S.vp === 'B' && activeNow(S.T).any) target = .12 * S.speed;
    S.rate += (target - S.rate) * (1 - Math.exp(-dt / 220));
    setT(S.T + S.rate * dt / 1000, true);
    if (S.T >= T_END) setPlaying(false);
  }
  // camera
  let goal = null;
  if (!S.userCam) goal = S.vp === 'B' ? guidedGoal(S.T, now) : fit(theatre());
  let moving = false;
  if (goal) {
    if (reduced.matches || !camInit) { Object.assign(cam, goal); camInit = true; }
    else {
      const k = 1 - Math.exp(-dt / 420);
      cam.cx += (goal.cx - cam.cx) * k; cam.cy += (goal.cy - cam.cy) * k; cam.s = Math.exp(Math.log(cam.s) + (Math.log(goal.s) - Math.log(cam.s)) * k);
      moving = Math.abs(goal.cx - cam.cx) * cam.s > .4 || Math.abs(goal.cy - cam.cy) * cam.s > .4 || Math.abs(Math.log(goal.s / cam.s)) > .002;
    }
  }
  drawBase(); render(now); renderTrack(); syncWhen();
  if (S.playing || moving || pulses.length) kick(); else lastNow = 0;
}
let camInit = false;
function setPlaying(on) {
  if (on && S.T >= T_END - .01) S.T = T_START;
  S.playing = on; S.rate = on ? BASE_RATE * S.speed : 0;
  if (on && S.vp === 'B') S.userCam = false;
  const b = $('#play');
  b.setAttribute('aria-label', on ? 'Pause' : 'Play');
  b.innerHTML = on ? '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" fill="currentColor"/><rect x="7" y="1.5" width="3" height="9" fill="currentColor"/></svg>' : '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>';
  lastNow = 0; kick();
}
$('#play').addEventListener('click', () => setPlaying(!S.playing));
$('#restart').addEventListener('click', () => { S.T = T_START; pulses.length = 0; kick(); });
const SPEEDS = [[.5, '½×'], [1, '1×'], [2, '2×']];
$('#speed').addEventListener('click', () => { const i = (SPEEDS.findIndex(s => s[0] === S.speed) + 1) % SPEEDS.length; S.speed = SPEEDS[i][0]; $('#speed').textContent = SPEEDS[i][1]; });

// scrubbing the bar
let scrub = null;
track.addEventListener('pointerdown', ev => {
  const hit = ev.target.closest('[data-hit]');
  if (hit) { openItem(hit.dataset.hit); return; }
  scrub = { wasPlaying: S.playing }; setPlaying(false); try { track.setPointerCapture(ev.pointerId); } catch {}
  setT(fromX(ev.clientX - track.getBoundingClientRect().left));
});
track.addEventListener('pointermove', ev => {
  if (scrub) { setT(fromX(ev.clientX - track.getBoundingClientRect().left)); return; }
  const hit = ev.target.closest('[data-hit]');
  if (hit) showTip(ev, ITEM[hit.dataset.hit]); else hideTip();
});
track.addEventListener('pointerup', () => { if (scrub && scrub.wasPlaying) setPlaying(true); scrub = null; });
track.addEventListener('pointerleave', hideTip);

// ---------- map gestures: drag to pan, wheel or pinch to zoom, click to open ----------
const pts = new Map(); let drag = null;
function zoomAt(f, sx, sy) {
  const before = toMap([sx, sy]);
  cam.s = Math.min(400, Math.max(12, cam.s * f));
  const after = toMap([sx, sy]);
  cam.cx += before[0] - after[0]; cam.cy += before[1] - after[1];
  S.userCam = true; kick();
}
mapbox.addEventListener('wheel', ev => { ev.preventDefault(); const r = mapbox.getBoundingClientRect(); zoomAt(Math.exp(-ev.deltaY * .0016), ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
ov.addEventListener('pointerdown', ev => {
  pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
  try { ov.setPointerCapture(ev.pointerId); } catch {}
  drag = { x: ev.clientX, y: ev.clientY, moved: false, hit: ev.target.closest('[data-hit]')?.dataset.hit, pinch: pts.size === 2 ? pinchState() : null };
});
function pinchState() { const [a, b] = [...pts.values()]; return { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: cam.s }; }
ov.addEventListener('pointermove', ev => {
  if (!drag) { const h = ev.target.closest('[data-hit]'); const id = h?.dataset.hit || null; if (id !== S.hover) { S.hover = id; kick(); } if (id) showTip(ev, ITEM[id]); else hideTip(); return; }
  const prev = pts.get(ev.pointerId); pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pts.size === 2) {
    if (!drag.pinch) drag.pinch = pinchState();
    const [a, b] = [...pts.values()], r = mapbox.getBoundingClientRect();
    const f = Math.hypot(a[0] - b[0], a[1] - b[1]) / drag.pinch.d * drag.pinch.s / cam.s;
    zoomAt(f, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); drag.moved = true; return;
  }
  if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 5) return;
  drag.moved = true; mapbox.classList.add('dragging'); hideTip();
  cam.cx -= (ev.clientX - prev[0]) / cam.s; cam.cy -= (ev.clientY - prev[1]) / cam.s; S.userCam = true; kick();
});
const endDrag = ev => {
  pts.delete(ev.pointerId);
  if (drag && !drag.moved && ev.type === 'pointerup') { if (drag.hit) openItem(drag.hit); else closeCard(); }
  if (!pts.size) { drag = null; mapbox.classList.remove('dragging'); }
};
ov.addEventListener('pointerup', endDrag); ov.addEventListener('pointercancel', endDrag);
ov.addEventListener('pointerleave', () => { if (!drag && S.hover) { S.hover = null; hideTip(); kick(); } });
$('#zin').addEventListener('click', () => zoomAt(1.5, mapbox.clientWidth / 2, mapbox.clientHeight / 2));
$('#zout').addEventListener('click', () => zoomAt(1 / 1.5, mapbox.clientWidth / 2, mapbox.clientHeight / 2));
$('#zfit').addEventListener('click', () => { holdGoal = null; S.userCam = true; Object.assign(cam, fit(THEATRE_ALL)); kick(); });

// ---------- tooltip and card ----------
function showTip(ev, it) {
  if (!it) return;
  const r = app.getBoundingClientRect();
  tip.innerHTML = it.kind === 'battle'
    ? `<b>${esc(it.name)}</b> · ${seasonOf(it.t)}<br>${esc(it.res)}`
    : `<b>${esc(it.name)}</b><br>${seasonOf(it.from)} · ${esc(forceText(it.force))}`;
  tip.hidden = false;
  const mb = mapbox.getBoundingClientRect();
  let x = ev.clientX - mb.left + 14, y = ev.clientY - mb.top + 14;
  if (x + tip.offsetWidth > mb.width - 8) x = ev.clientX - mb.left - tip.offsetWidth - 10;
  if (y + tip.offsetHeight > mb.height - 4) y = ev.clientY - mb.top - tip.offsetHeight - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.hidden = true; }
const card = $('#card'), cbody = $('#cbody');
const GL_BATTLE = '<svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="currentColor"/><path d="M6 6l6 6M12 6l-6 6" stroke="var(--panel)" stroke-width="1.8"/></svg>';
const GL_ROUTE = '<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 13c4-1 6-7 11-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 4.2l-4.6-1.3 1.6 4.4z" fill="currentColor"/></svg>';
function openItem(id) {
  const it = ITEM[id]; if (!it) return;
  S.sel = id; hideTip();
  const c = `var(--${it.kind === 'battle' ? it.win : it.side})`;
  card.style.setProperty('--c', c);
  const quote = it.q ? `<blockquote>${esc(it.q[0])}<cite>${esc(it.q[1])}${it.q[2] ? ' › ' + esc(it.q[2]) : ''} · your highlight</cite></blockquote>` : '<p class="none">Nothing highlighted about this yet.</p>';
  if (it.kind === 'battle') {
    cbody.innerHTML = `<p class="kind">${GL_BATTLE}Battle · Peloponnesian War</p><h2>${esc(it.name)}</h2><p class="meta">${seasonOf(it.t)}</p>
      <dl class="facts"><dt>Outcome</dt><dd><i class="sw" style="--c:${c}"></i>${esc(it.res)}</dd><dt>What happened</dt><dd>${esc(it.note)}</dd></dl>${quote}
      <div class="actions"><button type="button" disabled title="Not part of this prototype">Open in the reader</button><button type="button" data-go="${it.id}">Go to this moment</button></div>`;
  } else {
    const F = it.force;
    cbody.innerHTML = `<p class="kind">${GL_ROUTE}Campaign · Peloponnesian War</p><h2>${esc(it.name)}</h2><p class="meta">${seasonOf(it.from)}</p>
      <dl class="facts"><dt>Side</dt><dd><i class="sw" style="--c:${c}"></i>${sideName[it.side]}</dd><dt>Force</dt><dd>${esc(forceText(F))}${F && F.note ? `<br><span class="range">${esc(F.note)}</span>` : ''}</dd></dl>${quote}
      <div class="actions"><button type="button" disabled title="Not part of this prototype">Open in the reader</button><button type="button" data-go="${it.id}">Watch it again</button></div>`;
  }
  card.classList.add('open'); kick();
}
function closeCard() { if (!S.sel) return; S.sel = null; card.classList.remove('open'); kick(); }
$('#cclose').addEventListener('click', closeCard);
cbody.addEventListener('click', ev => {
  const b = ev.target.closest('[data-go]'); if (!b) return;
  const it = ITEM[b.dataset.go];
  if (it.kind === 'battle') { S.T = it.t - .02; setT(it.t + .001); }
  else { S.T = it.from - .01; setPlaying(true); }
  kick();
});
document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('input, textarea')) return;
  if (ev.key === ' ') { ev.preventDefault(); setPlaying(!S.playing); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); setT(S.T + .25); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); setT(S.T - .25); }
  else if (ev.key === 'Home') { S.T = T_START; kick(); }
  else if (ev.key === 'End') setT(T_END);
  else if (ev.key === 'Escape') closeCard();
});

// ---------- key ----------
function renderKey() {
  const k = $('#key');
  const line = '<svg width="28" height="10"><path d="M1 5h20" stroke="var(--ink-2)" stroke-width="2.4" stroke-linecap="round"/><path d="M27 5l-7-4v8z" fill="var(--ink-2)"/></svg>';
  const rows = [`<div>${glyphBattleSmall()}Battle, coloured by the winner</div>`];
  if (S.vr === 'A') rows.push(`<div>${line}Campaign, fading as it ages</div>`);
  else rows.push('<div class="hd">Width = size of the force</div>',
    `<div class="scale"><i style="height:${widthPx(5000).toFixed(1)}px"></i>5,000 men<i style="height:${widthPx(20000).toFixed(1)}px"></i>20,000<i style="height:${widthPx(40000).toFixed(1)}px"></i>40,000</div>`,
    `<div><svg width="34" height="14"><rect x="0" y="0" width="34" height="14" fill="var(--ink-2)" opacity=".22"/><rect x="0" y="4" width="34" height="6" fill="var(--ink-2)"/></svg>Estimates disagree</div>`,
    `<div><svg width="34" height="6"><path d="M1 3h32" stroke="var(--ink-2)" stroke-width="1.6" stroke-dasharray="4 3"/></svg>Size unknown</div>`);
  rows.push(`<div><svg width="10" height="10"><rect x="1.5" y="1.5" width="7" height="7" fill="var(--ink-2)"/></svg>City, by the side it was on</div>`);
  k.innerHTML = rows.join('');
}
function glyphBattleSmall() { return '<svg width="14" height="14" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.5" fill="var(--ink-2)"/><path d="M6 6l6 6M12 6l-6 6" stroke="var(--panel)" stroke-width="1.8"/></svg>'; }
$('#keybtn').addEventListener('click', () => { const k = $('#key'), on = !k.classList.contains('show'); k.classList.toggle('show', on); $('#keybtn').setAttribute('aria-expanded', String(on)); $('#keybtn').textContent = on ? 'Hide key' : 'Key'; });

// ---------- prototype controls ----------
const NOTES = {
  vr: {
    A: '<b>A · Lines.</b> Each campaign draws in as a line in its side’s colour, with an arrow at its head. Older campaigns fade but stay, so by 404 the map is a summary of the whole war.',
    B: '<b>B · Minard.</b> A campaign is as wide as its force, as in Minard’s map of 1812: the retreat from Syracuse narrows from 40,000 to 7,000. A soft band shows the range when sources disagree, and a thin dashed line means the size is unknown.',
  },
  vp: {
    A: ' <b>A · Steady</b> moves the year at an even pace over the whole war.',
    B: ' <b>B · Guided</b> follows each campaign with the camera, slows time while armies and fleets are moving, and hurries through quiet winters.',
  },
};
function syncNote() { $('#pnote').innerHTML = NOTES.vr[S.vr] + NOTES.vp[S.vp] + '<span class="how">Press Play, or drag along the war’s bar under the map. Battles pulse once when the year reaches them; click one, or a route, for the highlights behind it. Space plays and pauses, ← → step a season. Thucydides counts the war in summers and winters, and so does the year card.</span>'; }
function seg(id, cb) {
  const f = document.getElementById(id);
  f.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-v]'); if (!b) return;
    f.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    cb(b.dataset.v);
  });
  return f;
}
seg('vr', v => { S.vr = v; renderKey(); syncNote(); kick(); });
seg('vp', v => { S.vp = v; S.userCam = false; holdGoal = null; syncNote(); kick(); });
seg('dev', v => { device.classList.toggle('phone', v === 'phone'); closeCard(); });
const thm = seg('thm', v => { document.documentElement.dataset.theme = v; kick(); });
const darkNow = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
thm.querySelector(`[data-v="${darkNow() ? 'dark' : 'light'}"]`).setAttribute('aria-pressed', 'true');

new ResizeObserver(() => { app.classList.toggle('is-phone', isPhone()); camInit = S.userCam ? camInit : false; renderAxis(); kick(); }).observe(mapbox);
app.classList.toggle('is-phone', isPhone());
renderKey(); syncNote(); setPlaying(false); renderAxis();
document.fonts && document.fonts.ready.then(() => kick());
})();
</script>
