<title>Add to Chronicle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Phase 4c prototype (h). The reader on the left with the Add to Chronicle button under the title; map over the one
   timeline on the right (Athens open, seven lanes). What the button adds lands unchecked: dashed in the lanes and on the
   map, its quotes marked in the text, with one Undo in a bar under the timeline and a Check list (A in the tray, B in the
   drawer). Tokens are Chronicle's. Sample text written for this prototype; records from the Classical Greece fixture. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8; --page: #fbfbf8;
  --politics: #2f5da8; --war: #c23b22; --economy: #b8860b; --society: #a33b6b; --ideas: #4b3f8c; --technology: #2e8b74; --nature: #6b7a32; --umber: #7a5a3a;
  --map-water: #c9d6d8; --map-land: #ece4cf; --map-border: #a9a48f; --grat: #b7c6c9;
  --link: #2f5da8; --thumb: #d9d4c4;
  --font-read: 'Spectral', Georgia, serif;
  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;
  --font-ui: 'Public Sans', system-ui, sans-serif;
  --motion-quick: 150ms; --motion-move: 400ms; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --page: #161f28;
    --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --society: #d06d9a; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
    --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
    --link: #8fb0e8; --thumb: #3a3f3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --page: #161f28;
  --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --society: #d06d9a; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
  --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
  --link: #8fb0e8; --thumb: #3a3f3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- prototype chrome ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.reset { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 96ch; min-height: 3em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 2px; }
.stage { display: flex; justify-content: center; min-width: 0; }
.device { position: relative; width: min(1240px, 100%); height: 800px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 84vh; min-height: 640px; border: 1px solid var(--rule); border-radius: 12px; }
}

/* ---------- the app ---------- */
.app { position: absolute; inset: 0; display: grid; grid-template-rows: 46px minmax(0, 1fr); background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--rule); background: var(--panel); min-width: 0; }
.trail { display: flex; align-items: baseline; gap: 6px; font: 15px/1 var(--font-read); white-space: nowrap; min-width: 0; overflow: hidden; }
.trail .prev, .trail .sep { color: var(--muted); }
.trail .cur { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.trail .back { display: none; border: 0; background: none; font-size: 22px; line-height: 1; padding: 0 4px 2px 0; cursor: pointer; color: var(--ink-2); }
.open-article { margin-left: auto; width: 240px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--muted); font-size: 13px; }
.mapbtn { display: none; margin-left: auto; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
.mapbtn i { font-style: normal; display: inline-block; min-width: 18px; margin-left: 4px; padding: 1px 5px; border-radius: 8px; border: 1px dashed var(--umber); color: var(--umber); font-size: 11px; }

.body { display: grid; grid-template-columns: minmax(0, 590px) minmax(0, 1fr); min-height: 0; position: relative; }
.readcol { position: relative; min-height: 0; border-right: 1px solid var(--rule); background: var(--page); }
.reader { position: absolute; inset: 0; overflow-y: auto; scroll-behavior: smooth; }
.page { position: relative; padding: 26px 40px 320px; display: grid; grid-template-columns: minmax(0, 34em); justify-content: center; }
.article { font: 17px/1.62 var(--font-read); color: var(--ink); min-width: 0; }
.article h1 { font: 500 32px/1.15 var(--font-read); margin: 0 0 4px; text-wrap: balance; }
.article .byline { font: 12px/1.4 var(--font-ui); color: var(--muted); margin: 0 0 12px; }
.article h2 { font: 600 19px/1.3 var(--font-read); margin: 26px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--rule-soft); text-wrap: balance; }
.article p { margin: 0 0 12px; }
.article a { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 35%, transparent); text-underline-offset: 3px; }
.s { border-radius: 2px; transition: background-color var(--motion-quick); }
/* a quote a record rests on: unchecked is a faint umber wash with a dashed underline; checked is the "added" mark */
.s.q { cursor: pointer; text-decoration: underline dashed var(--umber); text-decoration-thickness: 1px; text-underline-offset: 4px; }
.s.q.ok { background: color-mix(in srgb, var(--c) 18%, transparent); text-decoration: underline solid var(--c); }
.s.q.flash { background: color-mix(in srgb, var(--umber) 30%, transparent); }
.s.q.ok.flash { background: color-mix(in srgb, var(--c) 36%, transparent); }

/* the button and its states */
.addrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 16px; padding: 10px 0 12px; border-top: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); font-family: var(--font-ui); }
.addbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); border-radius: 6px; padding: 8px 14px 8px 11px; font-size: 14px; font-weight: 600; cursor: pointer; }
.addbtn svg { flex: none; }
.addbtn:disabled { cursor: default; }
.addbtn.busy { background: var(--panel); color: var(--ink); border-color: var(--rule); }
.addbtn.done { background: var(--panel); color: var(--ink); border-color: var(--rule); font-weight: 500; }
.addbtn.off { background: var(--panel); color: var(--muted); border-color: var(--rule); border-style: dashed; font-weight: 500; }
.addbtn .n { font-variant-numeric: tabular-nums; }
.linkbtn { border: 0; background: none; padding: 6px 2px; font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.addnote { flex: 1 1 220px; margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.addnote b { font-weight: 600; color: var(--ink-2); }
.addnote.warn { color: var(--ink-2); }
.steps { flex-basis: 100%; list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 7px; }
.steps li.done { color: var(--ink-2); }
.steps li .dot { width: 12px; text-align: center; }
.steps li.now .dot::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--umber); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.spin { width: 14px; height: 14px; border: 2px solid var(--rule); border-top-color: var(--ink); border-radius: 50%; animation: turn .8s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }

/* ---------- the Check list: rows shared by the tray (A) and the drawer (B) ---------- */
.tray { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; }
.tray-inner { margin: 0 auto; background: var(--panel); border-top: 1px solid var(--rule); box-shadow: 0 -12px 28px -20px rgb(0 0 0 / .35); }
.check { display: flex; flex-direction: column; max-height: 470px; font-size: 13px; animation: rise var(--motion-move) var(--ease); }
.check header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 40px 10px; border-bottom: 1px solid var(--rule-soft); }
.check header h2 { margin: 0; font: 600 14px/1.3 var(--font-ui); flex: 1 1 200px; }
.check header h2 span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
.check header button { border: 1px solid var(--rule); background: var(--bg); border-radius: 5px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
.check header .primary { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 600; }
.check header .x { order: 1; border: 0; background: none; font-size: 18px; line-height: 1; padding: 4px 6px; color: var(--muted); }
.check .cbody { overflow-y: auto; padding: 10px 40px 14px; min-height: 0; }
.dgroup { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
.dgroup:first-child { margin-top: 0; }
.drows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.drow { --c: var(--umber); display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 8px; padding: 8px 10px 9px 8px; border: 1px dashed color-mix(in srgb, var(--umber) 65%, transparent); border-radius: 6px; background: var(--panel); scroll-margin: 12px; transition: box-shadow var(--motion-quick); }
.drow .glyph { width: 18px; height: 18px; display: block; color: var(--umber); margin-top: 2px; }
.drow.ok { border-style: solid; border-color: var(--rule); }
.drow.ok .glyph { color: var(--c); }
.drow.gone { opacity: .55; }
.drow.gone .t { text-decoration: line-through; text-decoration-color: var(--muted); }
.drow.sel { box-shadow: 0 0 0 2px var(--focus); }
.drow .t { font: 500 15px/1.3 var(--font-read); }
.drow .m { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.drow .m i { font-style: normal; color: var(--umber); }
.drow .ev { margin: 5px 0 0; font: italic 13px/1.4 var(--font-read); color: var(--ink-2); cursor: pointer; }
.drow .ev:hover { color: var(--ink); }
.drow .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
.drow .acts button { border: 1px solid var(--rule); background: var(--bg); padding: 5px 9px; border-radius: 5px; font-size: 12px; cursor: pointer; }
.drow .acts .primary { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 600; }
.drow .acts .quiet { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 5px 3px; }
.drow .acts .state { font-size: 12px; color: var(--ink-2); }
.lanechips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
.lanechips i { width: 8px; height: 8px; border-radius: 2px; background: var(--l); display: inline-block; }
.end { text-underline-offset: 3px; }
.end.have { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--ink-2) 50%, transparent); }
.end.new { text-decoration: underline dashed var(--umber); text-decoration-thickness: 1px; }
.eff { display: inline-block; font: 500 11px/1 var(--font-ui); color: var(--umber); border: 1px dashed var(--umber); border-radius: 10px; padding: 3px 7px; margin: 0 3px; vertical-align: 2px; white-space: nowrap; }
.ok .eff { border-style: solid; color: var(--ink-2); border-color: var(--rule); }
.also { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.also li { display: flex; gap: 8px; align-items: baseline; }
.also li::before { content: '·'; color: var(--muted); }
.have-line { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.is-phone .tray-inner { border-radius: 14px 14px 0 0; position: relative; }
.is-phone .tray-inner::before { content: ''; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--rule); z-index: 1; }
.is-phone .check { max-height: 600px; }
.is-phone .check header { padding: 18px 16px 10px; }
.is-phone .check .cbody { padding: 10px 16px 18px; }

.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; z-index: 8; background: var(--panel); border-left: 1px solid var(--rule); box-shadow: -14px 0 30px -22px rgb(0 0 0 / .45); display: flex; flex-direction: column; animation: slidein var(--motion-move) var(--ease); }
.drawer .check { max-height: none; height: 100%; animation: none; }
.drawer .check header, .drawer .check .cbody { padding-left: 16px; padding-right: 16px; }
.drawer .check header h2 { flex: 1 1 0; min-width: 0; }
.drawer .check header .primary { order: 2; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.is-phone .drawer { top: 54px; left: 0; width: auto; border-left: 0; border-top: 1px solid var(--rule); border-radius: 14px 14px 0 0; box-shadow: 0 -14px 30px -18px rgb(0 0 0 / .5); animation-name: rise; }

/* ---------- map, timeline and the bar under it ---------- */
.side { display: grid; grid-template-rows: minmax(0, 1fr) 340px auto; min-height: 0; background: var(--panel); }
.sidehead { display: none; }
.mapbox { position: relative; background: var(--map-water); min-height: 0; overflow: hidden; }
.mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.maplabel { position: absolute; left: 10px; top: 8px; font-size: 11px; color: var(--ink-2); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 6px; border-radius: 3px; }
.land { fill: var(--map-land); stroke: var(--map-border); }
.grat { stroke: var(--grat); fill: none; }
.terr { fill: color-mix(in srgb, var(--politics) 16%, transparent); stroke: color-mix(in srgb, var(--politics) 70%, transparent); }
.terr.sparta { fill: color-mix(in srgb, var(--ink-2) 14%, transparent); stroke: color-mix(in srgb, var(--ink-2) 60%, transparent); }
.tname { font-family: var(--font-sc); fill: var(--ink-2); letter-spacing: .12em; paint-order: stroke; stroke: var(--map-land); stroke-linejoin: round; }
.plabel { font-family: var(--font-ui); fill: var(--ink); paint-order: stroke; stroke: var(--map-land); stroke-linejoin: round; }
.pin { cursor: pointer; }
.pin.unchecked .plabel { fill: var(--ink-2); font-style: italic; }
.pin.sel .plabel { font-weight: 600; fill: var(--ink); }
.fresh { animation: pop var(--motion-move) var(--ease) both; transform-box: fill-box; transform-origin: center; }
.ring { fill: none; transform-box: fill-box; transform-origin: center; animation: ring 1.1s var(--ease) forwards; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes ring { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }

.tl { position: relative; border-top: 1px solid var(--rule); background: var(--panel); overflow-y: auto; overflow-x: hidden; }
.tl svg { display: block; width: 100%; }
.axis text { font: 11px var(--font-read); font-variant-numeric: oldstyle-nums; fill: var(--muted); }
.axis line { stroke: var(--rule-soft); }
.region { font: 600 10.5px var(--font-sc); letter-spacing: .14em; fill: var(--muted); }
.strip { fill: color-mix(in srgb, var(--ink-2) 26%, var(--panel)); }
.strip.open { fill: color-mix(in srgb, var(--politics) 34%, var(--panel)); }
.sname { font: 600 13px var(--font-sc); letter-spacing: .06em; fill: var(--ink); }
.fold { font: 11px var(--font-ui); fill: var(--muted); }
.lanebg { fill: color-mix(in srgb, var(--c) 5%, transparent); }
.lname { font: 500 11px var(--font-ui); fill: var(--ink-2); }
.lempty { font: italic 11px var(--font-read); fill: var(--muted); }
.rec { cursor: pointer; }
.rec .bar { fill: color-mix(in srgb, var(--c) 24%, var(--panel)); stroke: var(--c); stroke-width: 1; }
.rec .life { stroke: var(--c); stroke-width: 2; }
.rec .dia { fill: var(--c); }
.rec .lab { font: 12px var(--font-read); fill: var(--ink); }
.rec .lab.in { font-size: 11.5px; }
.rec .q { fill: var(--umber); font: 600 11px var(--font-ui); }
.rec.unchecked .lab { fill: var(--ink-2); font-style: italic; }
/* A: dashed umber, the lane's colour held back until checked */
.sA .rec.unchecked .bar { fill: color-mix(in srgb, var(--umber) 7%, var(--panel)); stroke: var(--umber); stroke-dasharray: 4 3; }
.sA .rec.unchecked .life { stroke: var(--umber); stroke-dasharray: 4 3; }
.sA .rec.unchecked .dia { fill: var(--panel); stroke: var(--umber); stroke-dasharray: 2.5 2; stroke-width: 1.4; }
/* B: the lane's colour, dashed */
.sB .rec.unchecked .bar { fill: color-mix(in srgb, var(--c) 10%, var(--panel)); stroke: var(--c); stroke-dasharray: 4 3; }
.sB .rec.unchecked .life { stroke-dasharray: 4 3; }
.sB .rec.unchecked .dia { fill: var(--panel); stroke: var(--c); stroke-dasharray: 2.5 2; stroke-width: 1.4; }
.rec.sel .bar, .rec.sel .dia { stroke: var(--focus); stroke-width: 2; stroke-dasharray: none; }
.rec.sel .lab { font-weight: 600; fill: var(--ink); }
.rec.gone { display: none; }
.now { stroke: var(--ink); stroke-width: 1; opacity: .35; }

.addbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 9px 14px; border-top: 1px solid var(--rule); background: var(--panel); font-size: 13px; color: var(--ink-2); animation: rise var(--motion-move) var(--ease); }
.addbar .msg { flex: 1 1 200px; min-width: 0; line-height: 1.4; }
.addbar .msg em { font: italic 14px var(--font-read); color: var(--ink); }
.addbar .msg .dash { display: inline-block; width: 18px; height: 9px; border: 1px dashed var(--umber); border-radius: 2px; vertical-align: 0; margin: 0 2px; }
.addbar button { border: 1px solid var(--rule); background: var(--bg); border-radius: 5px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
.addbar .primary { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 600; }
.addbar .x { border: 0; background: none; font-size: 18px; line-height: 1; padding: 2px 4px; color: var(--muted); }
.readcol > .addbar { position: absolute; left: 10px; right: 10px; bottom: 12px; z-index: 4; border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 24px -14px rgb(0 0 0 / .45); }

.toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 9; max-width: calc(100% - 32px); background: var(--ink); color: var(--panel); font-size: 12.5px; padding: 8px 12px; border-radius: 6px; box-shadow: 0 8px 20px -10px rgb(0 0 0 / .5); }

/* ---------- phone ---------- */

  sparta: [[21.65,37.2],[21.95,37.5],[22.7,37.5],[23,37.2],[23.2,36.45],[22.5,36.4],[22.15,36.5],[21.7,36.8]],
};
const LANES = [['politics', 'Politics and law'], ['war', 'War'], ['economy', 'Economy'], ['society', 'Society'], ['ideas', 'Philosophy and religion'], ['technology', 'Technology'], ['nature', 'Nature']];
const LANE_NAME = Object.fromEntries(LANES);
const KIND = { war: 'War', span: 'Period', battle: 'Battle', event: 'Event', person: 'Person', polity: 'Polity' };
const ALL = Object.fromEntries([...ARTICLE.have, ...ARTICLE.entries].map((e) => [e.id, e]));

const $ = (id) => document.getElementById(id);
const app = $('app'), device = $('device');
const yr = (y) => (y <= 0 ? `${1 - y} BCE` : `${y} CE`);
const dates = (e) => e.b == null ? yr(e.a) : `${e.approxA ? 'c. ' : ''}${1 - e.a}–${yr(e.b)}`;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------- state ----------
const S = {
  phase: 'before',         // before | adding | added
  step: 0,                 // adding: which step is running
  env: 'ready', dash: 'A', place: 'A', device: 'laptop',
  status: {},              // record id → 'new' | 'ok' | 'gone'
  added: [],               // ids added in this run, records and connections
  fresh: new Set(), sel: null, checkOpen: false, barClosed: false, showMap: false, toast: '',
};
const subjectOnly = () => S.env === 'nokey';
const addedEntries = () => ARTICLE.entries.filter((e) => S.status[e.id]);
const addedConns = () => ARTICLE.connections.filter((c) => S.status[c.id]);
const unchecked = () => [...addedEntries(), ...addedConns()].filter((r) => S.status[r.id] === 'new');
const liveCount = () => addedEntries().filter((e) => S.status[e.id] !== 'gone').length;

function land() {
  const es = ARTICLE.entries.filter((e) => !subjectOnly() || e.by === 'code');
  const cs = ARTICLE.connections.filter((c) => !subjectOnly() || c.by === 'code');
  S.status = {};
  for (const r of [...es, ...cs]) S.status[r.id] = 'new';
  S.added = [...es, ...cs].map((r) => r.id);
  S.fresh = new Set(S.added);
  S.phase = 'added'; S.barClosed = false;
  setTimeout(() => { S.fresh.clear(); }, 1300);
}
function press() {
  if (S.env === 'offline') return;
  if (S.phase === 'added') return;
  S.phase = 'adding'; S.step = 0; render();
  const steps = subjectOnly() ? 2 : 3;
  const tick = () => {
    S.step++;
    if (S.step < steps) { render(); setTimeout(tick, 750); return; }
    land(); render();
  };
  setTimeout(tick, 750);
}
function undoAll() {
  S.phase = 'before'; S.status = {}; S.added = []; S.sel = null; S.checkOpen = false;
  flash('Took back everything added from Peloponnesian War.');
  render();
}
function update() {
  const removed = addedEntries().filter((e) => S.status[e.id] === 'gone').map((e) => e.t);
  flash(`Nothing new in the article. ${liveCount()} already in Chronicle${removed.length ? `; left out what you removed (${removed.join(', ')})` : ''}.`);
}
function check(id) { S.status[id] = 'ok'; S.fresh = new Set([id]); render(); setTimeout(() => S.fresh.clear(), 1200); }
function checkAll() { for (const r of unchecked()) S.status[r.id] = 'ok'; flash('All checked. They keep their source and quotes.'); render(); }
function removeOne(id) { S.status[id] = 'gone'; for (const c of ARTICLE.connections) if ((c.from === id || c.to === id) && S.status[c.id]) S.status[c.id] = 'gone'; render(); }
function restore(id) { S.status[id] = 'new'; for (const c of ARTICLE.connections) if ((c.from === id || c.to === id) && S.status[c.id] === 'gone') S.status[c.id] = 'new'; render(); }
function select(id, from) {
  S.sel = S.sel === id && from !== 'list' ? null : id;
  if (S.sel && S.phase === 'added') S.checkOpen = true;
  render();
  if (!S.sel) return;
  const row = document.querySelector(`.drow[data-id="${id}"]`); row?.scrollIntoView({ block: 'nearest' });
  const e = ALL[id];
  if (e?.q && from !== 'text') {
    const s = document.querySelector(`#article .s[data-s="${e.q}"]`);
    if (s && S.device === 'laptop') { s.scrollIntoView({ block: 'center' }); s.classList.add('flash'); setTimeout(() => s.classList.remove('flash'), 900); }
  }
}
let toastT;
function flash(msg) { S.toast = msg; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = ''; renderToast(); }, 3200); }

// ---------- the reader ----------
function renderArticle() {
  const used = {};
  for (const e of ARTICLE.entries) if (S.status[e.id] && S.status[e.id] !== 'gone') (used[e.q] ||= []).push(e);
  const sec = ARTICLE.sections.map(([h, ss]) => `${h ? `<h2>${h}</h2>` : ''}<p>${ss.map(([id, html]) => {
    const recs = used[id];
    if (!recs) return `<span class="s" data-s="${id}">${html.replace(/<a>/g, '<a href="#">')}</span>`;
    const ok = recs.every((r) => S.status[r.id] === 'ok');
    const c = `var(--${recs[0].lanes[0]})`;
    return `<span class="s q${ok ? ' ok' : ''}" style="--c:${c}" data-s="${id}" data-rec="${recs[0].id}" title="${esc(recs.map((r) => r.t).join(', '))}${ok ? '' : ' · not checked yet'}">${html.replace(/<a>/g, '<a href="#">')}</span>`;
  }).join(' ')}</p>`).join('');
  $('article').innerHTML = `<h1>Peloponnesian War</h1><p class="byline">Wikipedia · sample text written for this prototype · War, 431–404 BCE</p>${addRow()}${sec}`;
}
const PLUS = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const TICK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function addRow() {
  if (S.env === 'offline' && S.phase !== 'added') {
    return `<div class="addrow"><button class="addbtn off" type="button" disabled>${PLUS}Add to Chronicle</button><p class="addnote warn">Adding needs a connection. The article is saved, so you can keep reading and highlighting.</p></div>`;
  }
  if (S.phase === 'before') {
    const note = subjectOnly()
      ? `Adds the <b>war itself</b> from Wikidata, linked to Athens and Sparta. <b>Add your Claude key</b> in Drafting with AI and it also adds what the article describes.`
      : `Adds the war and what the article describes, up to about 20 records, marked to check. Uses your Claude key.`;
    return `<div class="addrow"><button class="addbtn" type="button" data-act="add">${PLUS}Add to Chronicle</button><p class="addnote">${note}</p></div>`;
  }
  if (S.phase === 'adding') {
    const steps = ['Looking it up on Wikidata', 'Finding Athens and Sparta in your Chronicle', 'Claude is reading the article'].slice(0, subjectOnly() ? 2 : 3);
    return `<div class="addrow"><button class="addbtn busy" type="button" disabled><span class="spin" aria-hidden="true"></span>Adding…</button><p class="addnote">You can keep reading.</p><ol class="steps" aria-live="polite">${steps.map((s, i) => `<li class="${i < S.step ? 'done' : i === S.step ? 'now' : ''}"><span class="dot">${i < S.step ? '✓' : ''}</span>${s}${i === S.step ? '…' : ''}</li>`).join('')}</ol></div>`;
  }
  const n = liveCount(), left = unchecked().length;
  return `<div class="addrow"><button class="addbtn done" type="button" data-act="open">${TICK}Added <span class="n">(${n})</span></button><button class="linkbtn" type="button" data-act="update"${S.env === 'offline' ? ' disabled title="Updating needs a connection"' : ''}>Update</button><p class="addnote">${left ? `${left} left to check, dashed until you do.` : 'All checked.'}${subjectOnly() ? ' A Claude key would add what the article describes.' : ''}</p></div>`;
}

// ---------- glyphs (from docs/design.md) ----------

    battle: '<circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.2 6.2l5.6 5.6M11.8 6.2l-5.6 5.6" stroke="currentColor" stroke-width="1.4"/>',
    event: '<circle cx="9" cy="9" r="3.6" fill="currentColor"/>',

// ---------- the Check list ----------
function quoteOf(id) {
  const s = ARTICLE.sections.flatMap((x) => x[1]).find((x) => x[0] === id);
  return s ? s[1].replace(/<\/?a>/g, '') : '';
}
function entryRow(e) {
  const st = S.status[e.id];
  const meta = [KIND[e.kind], dates(e).replace(/^(\d+)–(\d+ BCE)$/, '$1–$2')];
  if (e.place) meta.push(`${e.place[0]} <i>· looked up on Pleiades</i>`);
  if (e.partOf) meta.push(`part of ${ALL[e.partOf].t}`);
  const src = e.by === 'code' ? 'From Wikidata' : 'Claude, from the article';
  const lanes = `<span class="lanechips" title="${e.lanes.map((l) => LANE_NAME[l]).join(', ')}">${e.lanes.map((l) => `<i style="--l:var(--${l})"></i>`).join('')}</span>`;
  const acts = st === 'gone'
    ? `<span class="state">Removed</span><button class="quiet" type="button" data-act="restore" data-id="${e.id}">Undo</button>`
    : st === 'ok'
      ? `<span class="state">Checked</span><button type="button" data-act="edit" data-id="${e.id}">Edit</button>`
      : `<button class="primary" type="button" data-act="check" data-id="${e.id}">Looks right</button><button type="button" data-act="edit" data-id="${e.id}">Edit</button><button class="quiet" type="button" data-act="remove" data-id="${e.id}">Remove</button>`;
  return `<li class="drow${st === 'ok' ? ' ok' : ''}${st === 'gone' ? ' gone' : ''}${S.sel === e.id ? ' sel' : ''}" data-id="${e.id}" style="--c:var(--${e.lanes[0]})">${glyph(e.kind)}<div><div class="t">${e.t}${lanes}</div><div class="m">${meta.join(' · ')} · ${src}</div>${e.q ? `<p class="ev" data-act="quote" data-id="${e.id}">“${quoteOf(e.q)}”</p>` : ''}<div class="acts">${acts}</div></div></li>`;
}
function connRow(c) {
  const st = S.status[c.id], a = ALL[c.from], b = ALL[c.to];
  const end = (x) => `<span class="end ${ARTICLE.have.includes(x) ? 'have' : 'new'}">${x.t}</span>`;
  const body = c.side ? `${end(a)} <span class="eff">${c.side === 1 ? 'one side' : 'the other side'}</span> ${end(b)}` : `${end(a)} <span class="eff">${c.effect}</span> ${end(b)}`;
  const src = c.by === 'code' ? 'From Wikidata (participants)' : 'Claude, from the article';
  const acts = st === 'gone' ? `<span class="state">Removed with its entry</span>`
    : st === 'ok' ? `<span class="state">Checked</span>`
      : `<button class="primary" type="button" data-act="check" data-id="${c.id}">Looks right</button><button class="quiet" type="button" data-act="remove" data-id="${c.id}">Remove</button>`;
  return `<li class="drow${st === 'ok' ? ' ok' : ''}${st === 'gone' ? ' gone' : ''}" data-id="${c.id}" style="--c:var(--ink-2)">${glyph('link')}<div><div class="t" style="font-size:14px">${body}</div><div class="m">${src}</div>${c.q ? `<p class="ev" data-act="quote" data-id="${c.from}">“${quoteOf(c.q)}”</p>` : ''}<div class="acts">${acts}</div></div></li>`;
}
function checkHtml(inDrawer) {
  const es = addedEntries(), cs = addedConns(), left = unchecked().length;
  return `<section class="check" aria-label="Check what was added"><header><h2>Added from Peloponnesian War<span>${es.length} ${es.length === 1 ? 'entry' : 'entries'} and ${cs.length} connections · ${left ? `${left} left to check. Editing one checks it too.` : 'all checked'}</span></h2>${left ? `<button class="primary" type="button" data-act="checkall">They all look right</button>` : ''}<button class="x" type="button" data-act="closecheck" aria-label="Close">×</button></header><div class="cbody"><div class="dgroup">Entries</div><ul class="drows">${es.map(entryRow).join('')}</ul><div class="dgroup">Connections</div><ul class="drows">${cs.map(connRow).join('')}</ul><div class="dgroup">Also added</div><ul class="also">${ARTICLE.also.map((a) => `<li>${a}</li>`).join('')}</ul><p class="have-line">Already in Chronicle, so linked and not added again: Athens, Sparta, Pericles.</p></div></section>`;
}

// ---------- the bar under the timeline ----------
function barHtml() {
  if (S.phase !== 'added' || S.barClosed) return '';
  const n = liveCount(), left = unchecked().length;
  return `<div class="addbar" role="status"><span class="msg">Added ${n} ${n === 1 ? 'entry' : 'entries'} and ${addedConns().filter((c) => S.status[c.id] !== 'gone').length} links from <em>Peloponnesian War</em>${left ? ` · <span class="dash" aria-hidden="true"></span> ${left} to check` : ' · all checked'}</span>${left && !S.checkOpen ? `<button class="primary" type="button" data-act="open">Check them</button>` : ''}<button type="button" data-act="undo">Undo</button>${left ? '' : `<button class="x" type="button" data-act="closebar" aria-label="Close">×</button>`}</div>`;
}

// ---------- map ----------
function renderMap() {
  const box = $('mapbox'), svg = $('map');
  const cw = box.clientWidth, ch = box.clientHeight;
  if (!cw || !ch) return;
  const es = addedEntries().filter((e) => e.place && S.status[e.id] !== 'gone');
  const pts = [[15.1, 37.0], [26.7, 40.4], [21.6, 36.6], [24.2, 38.3]].map(([lo, la]) => P(lo, la));
  let x0 = Math.min(...pts.map((p) => p[0])) - 40, x1 = Math.max(...pts.map((p) => p[0])) + 160, y0 = Math.min(...pts.map((p) => p[1])) - 40, y1 = Math.max(...pts.map((p) => p[1])) + 40;
  let w = x1 - x0, h = y1 - y0;
  if (w / h < cw / ch) { const nw = h * cw / ch; x0 -= (nw - w) / 2; w = nw; } else { const nh = w * ch / cw; y0 -= (nh - h) / 2; h = nh; }
  const k = w / cw;
  const out = [];
  for (let lo = 12; lo <= 30; lo += 2) { const a = P(lo, 42.4), b = P(lo, 34.6); out.push(`<path class="grat" stroke-width="${.8 * k}" d="M${a[0]} ${a[1]}V${b[1]}"/>`); }
  for (let la = 35; la <= 42; la++) { const a = P(12, la), b = P(30.5, la); out.push(`<path class="grat" stroke-width="${.8 * k}" d="M${a[0]} ${a[1]}H${b[0]}"/>`); }
  out.push(`<path class="land" stroke-width="${.8 * k}" d="${GEO.d}"/>`);
  for (const [id, ring] of Object.entries(TERR)) {
    out.push(`<path class="terr ${id}" stroke-width="${1.2 * k}" d="M${ring.map((p) => P(...p).join(' ')).join('L')}Z"/>`);
  }
  const [ax, ay] = P(23.3, 37.62), [sx, sy] = P(22.3, 36.2);
  out.push(`<text class="tname" x="${ax}" y="${ay}" font-size="${11 * k}" stroke-width="${3 * k}" text-anchor="end">ATHENS</text><text class="tname" x="${sx}" y="${sy}" font-size="${11 * k}" stroke-width="${3 * k}" text-anchor="middle">SPARTA</text>`);
  // pins at one place stack into a list beside it
  const at = {};
  for (const e of es) (at[e.place[0]] ||= []).push(e);
  for (const list of Object.values(at)) {
    const [bx, by] = P(list[0].place[1], list[0].place[2]);
    list.forEach((e, n) => {
      const stacked = list.length > 1;
      const x = stacked ? bx + 16 * k : bx, y = stacked ? by - (list.length - 1) * 8.5 * k + n * 17 * k : by;
      if (stacked) out.push(`<path d="M${bx} ${by}L${x - 6 * k} ${y}" stroke="var(--ink-2)" stroke-width="${.6 * k}" opacity=".5"/>`);
      out.push(pin(e, x, y, k, x > x0 + w * .68));
    });
    if (list.length > 1) out.push(`<circle cx="${bx}" cy="${by}" r="${2.5 * k}" fill="var(--ink-2)"/>`);
  }
  svg.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
  svg.innerHTML = out.join('');
  $('maplabel').textContent = S.phase === 'added' ? 'Map · 431–404 BCE · what this article added' : 'Map · 431 BCE';
}
function pin(e, x, y, k, left) {
  const st = S.status[e.id], un = st === 'new', c = `var(--${e.lanes[0]})`;
  const ec = un && S.dash === 'A' ? 'var(--umber)' : c;
  let g;
  if (e.kind === 'person') g = `<circle cx="${x}" cy="${y}" r="${4.5 * k}" fill="var(--map-land)" stroke="${ec}" stroke-width="${2 * k}"${un ? ` stroke-dasharray="${2.5 * k} ${1.6 * k}"` : ''}/>`;
  else if (e.kind === 'battle') g = `<circle cx="${x}" cy="${y}" r="${6 * k}" fill="var(--map-land)" stroke="${ec}" stroke-width="${1.5 * k}"${un ? ` stroke-dasharray="${2.5 * k} ${1.6 * k}"` : ''}/><path d="M${x - 3 * k} ${y - 3 * k}l${6 * k} ${6 * k}M${x + 3 * k} ${y - 3 * k}l${-6 * k} ${6 * k}" stroke="${ec}" stroke-width="${1.4 * k}"/>`;
  else if (un) g = `<circle cx="${x}" cy="${y}" r="${5 * k}" fill="var(--map-land)" stroke="${ec}" stroke-width="${1.6 * k}" stroke-dasharray="${2.2 * k} ${1.6 * k}"/>`;
  else g = `<circle cx="${x}" cy="${y}" r="${5 * k}" fill="${c}"/>`;
  const sel = S.sel === e.id ? `<circle cx="${x}" cy="${y}" r="${10 * k}" fill="none" stroke="var(--focus)" stroke-width="${2 * k}"/>` : '';
  const ring = S.fresh.has(e.id) ? `<circle class="ring" cx="${x}" cy="${y}" r="${8 * k}" stroke="${ec}" stroke-width="${2 * k}"/>` : '';
  const label = `<text class="plabel" x="${left ? x - 10 * k : x + 10 * k}" y="${y + 4 * k}" font-size="${11.5 * k}" stroke-width="${3 * k}"${left ? ' text-anchor="end"' : ''}>${e.t}${un ? '<tspan fill="var(--umber)" font-style="normal"> ?</tspan>' : ''}</text>`;
  return `<g class="pin${un ? ' unchecked' : ''}${S.sel === e.id ? ' sel' : ''}${S.fresh.has(e.id) ? ' fresh' : ''}" data-id="${e.id}" tabindex="0" role="button" aria-label="${e.t}${un ? ', not checked yet' : ''}">${sel}${ring}${g}${label}</g>`;
}

// ---------- the one timeline: Athens open with its seven lanes ----------
const W0 = bce(434), W1 = bce(400);
const LW = 7.1; // Spectral 12px, roughly, per character
function renderTimeline() {
  const tl = $('tl'), W = tl.clientWidth;
  if (!W) return;
  const phone = S.device === 'phone';
  const G = phone ? 92 : 172, x0 = G + 6, x1 = W - 14;
  const X = (y) => x0 + ((y - W0) / (W1 - W0)) * (x1 - x0);
  const out = [];
  let y = 26;
  // axis
  const ax = [];
  for (let t = 430; t >= 400; t -= phone ? 10 : 5) { const x = X(bce(t)); ax.push(`<line x1="${x}" x2="${x}" y1="20" y2="100%"/><text x="${x}" y="14" text-anchor="middle">${t} BCE</text>`); }
  out.push(`<g class="axis">${ax.join('')}</g>`);
  // region and strips
  out.push(`<text class="region" x="10" y="${y + 9}">GREECE</text>`); y += 16;
  out.push(`<rect class="strip open" x="${x0}" y="${y}" width="${x1 - x0}" height="12" rx="2"/><text class="sname" x="10" y="${y + 10}">Athens</text>${phone ? '' : `<text class="fold" x="${G - 4}" y="${y + 10}" text-anchor="end">Fold</text>`}`);
  y += 18;
  // lanes
  const recs = [...ARTICLE.have.filter((e) => e.lanes), ...addedEntries()];
  for (const [lane, name] of LANES) {
    const items = recs.filter((e) => e.lanes.includes(lane) && S.status[e.id] !== 'gone')
      .map((e) => ({ e, a: Math.max(e.a, W0), b: e.b == null ? null : Math.min(e.b, W1) }))
      .sort((p, q) => p.a - q.a);
    // pack: each item occupies its bar (or diamond) plus its label
    const rows = [];
    const placed = items.map((it) => {
      const xa = X(it.a), xb = it.b == null ? xa : X(it.b);
      const lw = it.e.t.length * LW + (S.status[it.e.id] === 'new' ? 12 : 0);
      const inside = it.b != null && xb - xa > lw + 14;
      const end = inside ? xb : (it.b == null ? xa + 8 : xb) + 4 + lw;
      const flip = !inside && end > x1;
      const start = flip ? xa - 6 - lw : xa;
      let r = rows.findIndex((last) => last < start - 6);
      if (r < 0) { rows.push(0); r = rows.length - 1; }
      rows[r] = flip ? xb : end;
      return { ...it, xa, xb, inside, flip, row: r };
    });
    const nRows = Math.max(1, rows.length), h = placed.length ? nRows * 19 + 6 : 20;
    out.push(`<g style="--c:var(--${lane})"><rect class="lanebg" x="${x0 - 4}" y="${y}" width="${x1 - x0 + 8}" height="${h}"/><rect x="14" y="${y + 6}" width="8" height="8" rx="1.5" fill="var(--c)"/><text class="lname" x="27" y="${y + 13.5}">${phone ? name.split(' ')[0] : name}</text>`);
    if (!placed.length) out.push(`<text class="lempty" x="${x0 + 4}" y="${y + 13.5}">Nothing here yet</text>`);
    for (const p of placed) out.push(recSvg({ ...p, x1 }, y + 3 + p.row * 19));
    out.push('</g>');
    y += h + 2;
  }
  y += 6;
  out.push(`<rect class="strip" x="${x0}" y="${y}" width="${x1 - x0}" height="10" rx="2"/><text class="sname" x="10" y="${y + 9}">Sparta</text>`); y += 22;
  out.push(`<text class="region" x="10" y="${y + 9}">PERSIA</text>`); y += 16;
  out.push(`<rect class="strip" x="${x0}" y="${y}" width="${x1 - x0}" height="14" rx="2"/><text class="sname" x="10" y="${y + 11}">Achaemenid Persia</text>`); y += 24;
  tl.innerHTML = `<svg class="s${S.dash}" height="${y}" viewBox="0 0 ${W} ${y}" role="group" aria-label="Timeline, 434 to 400 BCE">${out.join('')}</svg>`;
}
function recSvg(p, top) {
  const e = p.e, st = S.status[e.id] ?? 'ok', un = st === 'new';
  const cls = `rec${un ? ' unchecked' : ''}${S.sel === e.id ? ' sel' : ''}${S.fresh.has(e.id) ? ' fresh' : ''}`;
  const q = un ? `<tspan class="q"> ?</tspan>` : '';
  let g;
  if (e.kind === 'person') {
    g = `<line class="life" x1="${p.xa}" x2="${p.xb}" y1="${top + 8}" y2="${top + 8}"${e.approxA && !un ? ' stroke-dasharray="5 3"' : ''}/><circle class="dia" cx="${p.xb}" cy="${top + 8}" r="2.6"/><text class="lab" x="${p.flip ? p.xb - 7 : p.xb + 6}" y="${p.flip ? top + 5 : top + 12}"${p.flip ? ' text-anchor="end"' : ''}>${e.t}${q}</text>`;
  } else if (p.b == null) {
    const x = p.xa, s = 5.2;
    g = `<path class="dia" d="M${x} ${top + 8 - s}L${x + s} ${top + 8}L${x} ${top + 8 + s}L${x - s} ${top + 8}Z"/><text class="lab" x="${p.flip ? x - 8 : x + 8}" y="${top + 12}"${p.flip ? ' text-anchor="end"' : ''}>${e.t}${q}</text>`;
  } else {
    const w = Math.max(3, p.xb - p.xa);
    const ticks = e.kind === 'war' ? ARTICLE.entries.filter((b) => b.kind === 'battle' && S.status[b.id] && S.status[b.id] !== 'gone').map((b) => `<line x1="${X2(p, b.a)}" x2="${X2(p, b.a)}" y1="${top + 2}" y2="${top + 14}" stroke="var(--c)" stroke-width="1.2"/>`).join('') : '';
    g = `<rect class="bar" x="${p.xa}" y="${top + 1}" width="${w}" height="14" rx="2"/>${ticks}<text class="lab${p.inside ? ' in' : ''}" x="${p.inside ? p.xa + 6 : p.flip ? p.xa - 5 : p.xb + 5}" y="${top + 12}"${p.flip ? ' text-anchor="end"' : ''}>${e.t}${q}</text>`;
  }
  return `<g class="${cls}" data-id="${e.id}" tabindex="0" role="button" aria-label="${e.t}, ${dates(e)}${un ? ', not checked yet' : ''}">${g}</g>`;
}
function X2(p, y) { return p.xa + ((y - p.a) / ((p.b ?? p.a) - p.a || 1)) * (p.xb - p.xa); }

// ---------- render ----------
function renderToast() { const t = $('toast'); t.hidden = !S.toast; t.textContent = S.toast; }
function render() {
  document.querySelectorAll('.addbar').forEach((b) => b.remove());
  app.classList.toggle('is-phone', S.device === 'phone');
  app.classList.toggle('show-map', S.device === 'phone' && S.showMap);
  device.classList.toggle('phone', S.device === 'phone');
  renderArticle();
  const open = S.phase === 'added' && S.checkOpen;
  $('trayInner').innerHTML = open && S.place === 'A' ? checkHtml(false) : '';
  const dr = $('drawer'); dr.hidden = !(open && S.place === 'B'); dr.innerHTML = open && S.place === 'B' ? checkHtml(true) : '';
  const bar = barHtml();
  if (bar) {
    if (S.device === 'phone') { if (!open) $('readcol').insertAdjacentHTML('beforeend', bar); }
    else $('side').insertAdjacentHTML('beforeend', bar);
  }
  const left = unchecked().length;
  $('mapbtn').innerHTML = `Map${S.phase === 'added' && left ? `<i>${left}</i>` : ''}`;
  renderMap(); renderTimeline(); renderToast();
  for (const b of document.querySelectorAll('#jump button')) b.setAttribute('aria-pressed', String(b.dataset.v === jumpState()));
  $('pnote').innerHTML = NOTES[jumpState()]();
}
function jumpState() { return S.phase === 'added' ? (S.checkOpen ? 'checking' : 'added') : 'before'; }
const NOTES = {
  before: () => `<b>Before.</b> Bob is reading <i>Peloponnesian War</i>. He already has Athens, Sparta and Pericles; the war isn't in Chronicle yet. ${S.env === 'nokey' ? 'With <b>no Claude key</b>, the button adds only the war, from Wikidata.' : S.env === 'offline' ? '<b>Offline</b>, the button can’t add anything and says why.' : 'One press adds the war and what the article describes.'}<span class="how">Press Add to Chronicle. Switch Claude to No key or Offline to see those states.</span>`,
  added: () => `<b>Just added.</b> Everything landed at once and is <b>unchecked</b>: ${S.dash === 'A' ? 'dashed umber, the lane colour held back until checked' : 'its lane colour, with a dashed edge'}, a “?” after each name, on the timeline and the map. The quotes they rest on are marked in the text (dashed underline). The bar under the timeline has one Undo for the whole article.<span class="how">Click a dashed record, a marked sentence, or Check them. Undo takes it all back.</span>`,
  checking: () => `<b>Checking.</b> The Check list sits ${S.place === 'A' ? '<b>in the tray</b> under the text, like the capture card' : '<b>in the drawer</b>, over the map'}. Each row says where it came from and quotes its evidence; “Looks right” makes it solid with one ring. Editing one also checks it. Removing an entry takes its connections with it, and Update never brings it back.<span class="how">Click a record on the map or timeline to find its row; click a quote to find it in the text. Try Remove, then Update.</span>`,
};

// ---------- events ----------
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act], .rec, .pin, .s.q, .seg button, #reset, #mapbtn, #closeMap, a');
  if (!t) return;
  if (t.matches('a')) { ev.preventDefault(); }
  if (t.closest('.seg')) {
    const seg = t.closest('.seg').id, v = t.dataset.v;
    if (seg === 'jump') jumpTo(v);
    else if (seg === 'thm') { document.documentElement.dataset.theme = v; for (const b of t.parentNode.children) b.setAttribute('aria-pressed', String(b === t)); }
    else {
      const key = { dash: 'dash', place: 'place', env: 'env', dev: 'device' }[seg];
      S[key] = v; for (const b of t.parentNode.children) b.setAttribute('aria-pressed', String(b === t));
      if (seg === 'env' && S.phase === 'added') jumpTo('added');
    }
    render(); return;
  }
  if (t.id === 'reset') { jumpTo('before'); render(); return; }
  if (t.id === 'mapbtn') { S.showMap = true; render(); return; }
  if (t.id === 'closeMap') { S.showMap = false; render(); return; }
  if (t.matches('.rec, .pin')) { select(t.dataset.id, 'map'); return; }
  if (t.matches('.s.q') && !t.dataset.act) { select(t.dataset.rec, 'text'); return; }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'add': press(); break;
    case 'open': S.checkOpen = true; S.showMap = false; render(); break;
    case 'closecheck': S.checkOpen = false; S.sel = null; render(); break;
    case 'closebar': S.barClosed = true; render(); break;
    case 'undo': undoAll(); break;
    case 'update': update(); render(); break;
    case 'check': check(id); break;
    case 'checkall': checkAll(); break;
    case 'remove': removeOne(id); break;
    case 'restore': restore(id); break;
    case 'edit': S.status[id] = 'ok'; flash(`The editor opens on ${ALL[id].t}. Saving it checks it.`); render(); break;
    case 'quote': {
      const e = ALL[id]; const s = document.querySelector(`#article .s[data-s="${e.q}"]`);
      if (S.device === 'phone') { S.checkOpen = false; render(); }
      const s2 = document.querySelector(`#article .s[data-s="${e.q}"]`) || s;
      s2?.scrollIntoView({ block: 'center' }); s2?.classList.add('flash'); setTimeout(() => s2?.classList.remove('flash'), 1000);
      break;
    }
  }
});
document.addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('.rec, .pin')) { ev.preventDefault(); select(ev.target.dataset.id, 'map'); }
  if (ev.key === 'Escape') { S.sel = null; S.checkOpen = false; render(); }
});
function jumpTo(v) {
  S.sel = null; S.toast = ''; S.showMap = false;
  if (v === 'before') { S.phase = 'before'; S.status = {}; S.added = []; S.checkOpen = false; return; }
  land(); S.fresh.clear();
  if (v === 'checking') {
    S.checkOpen = true;
    const firsts = ['war', 'plague'].filter((x) => S.status[x]);
    for (const x of firsts) S.status[x] = 'ok';
    for (const c of ARTICLE.connections) if (S.status[c.id] && c.by === 'code') S.status[c.id] = 'ok';
  } else S.checkOpen = false;
}
new ResizeObserver(() => { renderMap(); renderTimeline(); }).observe($('device'));
render();
})();
</script>
