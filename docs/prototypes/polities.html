<title>Polity overview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a quiet desk holding one device (laptop or phone); inside it, Chronicle's map above the timeline, as in the reader layout's right-hand column. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8;
  --band: #e6e9e2; --band-2: #dde1d9; --band-edge: #c3c9c0;
  --sea: #dfe6e6; --land: #f4f3ee; --coast: #b9c1bd;
  /* The six lanes, each a historical pigment (proposed: war takes cinnabar, nature terre verte). */
  --politics: #2f5da8; --war: #c23b22; --economy: #b8860b; --ideas: #4b3f8c; --technology: #2e8b74; --nature: #6b7a32; --umber: #7a5a3a;
  /* World events: gold leaf, lighter and yellower than ochre, always with an ink edge. */
  --gold: #d9a521; --gold-2: #f3d27a; --gold-ink: #6e5208;
  /* Polity strips: a quiet tone per region parent, two shades so a succession reads. */
  --tone-europe: #8295ab; --tone-europe-2: #a4b3c4; --tone-neareast: #a8916f; --tone-neareast-2: #c4b08f; --tone-asia: #7f9b88; --tone-asia-2: #a2b9a8;
  --halo: #eef0ec;
  --font-read: 'Spectral', Georgia, serif;
  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;
  --font-ui: 'Public Sans', system-ui, sans-serif;
  --motion-quick: 150ms; --motion-move: 400ms; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
    --band: #18212a; --band-2: #1d2731; --band-edge: #36444f;
    --sea: #0f171e; --land: #1c2630; --coast: #3a4855;
    --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
    --gold: #e8b93a; --gold-2: #f6dc8c; --gold-ink: #2a1f02;
    --tone-europe: #61758c; --tone-europe-2: #7f92a8; --tone-neareast: #8a7556; --tone-neareast-2: #a38e6d; --tone-asia: #5f7a68; --tone-asia-2: #7c9886;
    --halo: #131b23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
  --band: #18212a; --band-2: #1d2731; --band-edge: #36444f;
  --sea: #0f171e; --land: #1c2630; --coast: #3a4855;
  --politics: #6f93d6; --war: #e0664c; --economy: #dcae45; --ideas: #9184d6; --technology: #58b89d; --nature: #a3b25e; --umber: #b9936b;
  --gold: #e8b93a; --gold-2: #f6dc8c; --gold-ink: #2a1f02;
  --tone-europe: #61758c; --tone-europe-2: #7f92a8; --tone-neareast: #8a7556; --tone-neareast-2: #a38e6d; --tone-asia: #5f7a68; --tone-asia-2: #7c9886;
  --halo: #131b23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- prototype chrome (outside the device) ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; letter-spacing: .01em; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; border: 1px solid var(--band-edge); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--band-edge); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--desk-ink); cursor: pointer; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.steps .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; }
.steps button { border: 1px solid var(--band-edge); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.steps button:hover { color: var(--ink); border-color: var(--ink-2); }
.steps button[aria-current="step"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.weights { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; color: var(--desk-ink); }
.weights .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.weights label { display: inline-flex; align-items: center; gap: 6px; }
.weights input[type=range] { width: 84px; accent-color: var(--ink-2); }
.weights output { font-variant-numeric: tabular-nums; min-width: 2.2ch; color: var(--ink); }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 86ch; min-height: 3em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 2px; }
.stage { display: flex; justify-content: center; min-width: 0; }

.device { position: relative; width: min(1240px, 100%); height: 800px; border: 1px solid var(--band-edge); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 86vh; min-height: 660px; border: 1px solid var(--band-edge); border-radius: 12px; }
}

/* ---------- the app inside ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-bottom: 1px solid var(--rule); background: var(--panel); flex: none; }
.crumbs { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 1; font: 15px/1 var(--font-read); white-space: nowrap; overflow: hidden; }
.crumbs button { border: 0; background: none; padding: 4px 0; cursor: pointer; font: inherit; color: var(--ink-2); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.crumbs .here { font: 600 15px/1 var(--font-sc); letter-spacing: .05em; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { color: var(--muted); }
.yearbox { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.yearbox .yr { font: 500 14px/1 var(--font-read); font-variant-numeric: oldstyle-nums tabular-nums; min-width: 7ch; text-align: right; }
.iconbtn { border: 1px solid var(--rule); background: none; border-radius: 6px; height: 28px; min-width: 30px; padding: 0 8px; cursor: pointer; color: var(--ink-2); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.iconbtn:hover { color: var(--ink); border-color: var(--ink-2); }
.zoomstops { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; flex: none; }
.zoomstops button { border: 0; background: none; padding: 5px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.zoomstops button + button { border-left: 1px solid var(--rule); }
.zoomstops button[aria-pressed="true"] { background: var(--rule-soft); color: var(--ink); font-weight: 600; }
.phone .zoomstops { display: none; }

.mapwrap { position: relative; flex: none; height: 300px; border-bottom: 1px solid var(--rule); background: var(--sea); overflow: hidden; }
.phone .mapwrap { height: 250px; }
.mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.maplegend { position: absolute; left: 10px; bottom: 8px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; pointer-events: none; }
.phone .maplegend .say { font-size: 12px; }
.maplegend .say { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; font: 13px/1.35 var(--font-read); color: var(--ink); max-width: 60ch; }
.maplegend .say b { font-weight: 600; }
.maplegend .key { display: inline-flex; gap: 8px; font-size: 11px; color: var(--ink-2); background: color-mix(in srgb, var(--panel) 88%, transparent); border-radius: 6px; padding: 3px 7px; border: 1px solid var(--rule); }
.maplegend .key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.focuschip { position: absolute; top: 8px; right: 10px; display: inline-flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12px; color: var(--ink-2); }
.focuschip button { border: 0; background: var(--rule-soft); border-radius: 999px; width: 20px; height: 20px; cursor: pointer; line-height: 1; }

.tl { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tlhead { flex: none; position: relative; background: var(--panel); border-bottom: 1px solid var(--rule); }
.tlhead svg, .tlbody svg { display: block; }
.tlbody { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y; cursor: grab; }
.tlbody.dragging { cursor: grabbing; }
.tlbody svg text { user-select: none; }
.hint { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 2px 6px; border-radius: 4px; }
.phone .hint { display: none; }

/* SVG type */
.t-region { font: 600 11.5px var(--font-sc); letter-spacing: .07em; fill: var(--ink-2); }
.t-parent { font: 600 10.5px var(--font-sc); letter-spacing: .16em; fill: var(--muted); }
.t-pol { font: 600 12px var(--font-sc); letter-spacing: .04em; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.t-pol-sub { font: 400 11px var(--font-read); fill: var(--ink-2); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; }
.t-era { font: italic 400 11.5px var(--font-read); fill: var(--muted); }
.t-era-in { font: italic 400 10.5px var(--font-read); fill: var(--muted); }
.t-axis { font: 400 11.5px var(--font-read); font-variant-numeric: oldstyle-nums; fill: var(--ink-2); }
.t-lane { font: 500 11px var(--font-ui); fill: var(--ink-2); }
.t-lane-n { font: 400 10.5px var(--font-ui); fill: var(--muted); font-variant-numeric: tabular-nums; }
.t-entry { font: 400 11px var(--font-ui); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.t-world { font: 500 12px var(--font-read); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.t-chip { font: 600 10px var(--font-ui); letter-spacing: .02em; }
.t-thread { font: 500 10.5px var(--font-ui); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; }
.t-empty { font: italic 400 11.5px var(--font-read); fill: var(--muted); }
.t-map { font: 600 11px var(--font-sc); letter-spacing: .04em; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-linejoin: round; }
.t-mapchip { font: 600 10px var(--font-ui); paint-order: stroke; stroke: var(--land); stroke-linejoin: round; }
.hit { cursor: pointer; }
.handle { cursor: grab; }
.handle:hover rect { fill: var(--rule-soft); }

.tip { position: absolute; z-index: 5; pointer-events: none; max-width: 300px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 8px 24px -12px rgb(0 0 0 / .35); padding: 8px 10px; font-size: 12px; color: var(--ink-2); }
.tip .tt { font: 600 14px/1.25 var(--font-read); color: var(--ink); }
.tip .td { color: var(--muted); font-variant-numeric: oldstyle-nums; font-family: var(--font-read); font-size: 13px; }
.tip .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.tip .chip { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; }
.tip .pr { margin-top: 5px; font-variant-numeric: tabular-nums; }
.tip .gen { margin-top: 4px; font-style: italic; color: var(--muted); }

/* Phone: a bottom sheet for an open polity's lanes. */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 72%; background: var(--panel); border-top: 1px solid var(--rule); border-radius: 14px 14px 0 0; box-shadow: 0 -12px 30px -18px rgb(0 0 0 / .4); display: flex; flex-direction: column; transform: translateY(100%); transition: transform var(--motion-move) var(--ease); z-index: 4; }
.sheet.open { transform: none; }
.sheet header { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; border-bottom: 1px solid var(--rule-soft); }
.sheet header h2 { margin: 0; font: 600 16px/1.2 var(--font-sc); letter-spacing: .05em; flex: 1; }
.sheet header .d { font: 13px var(--font-read); color: var(--muted); font-variant-numeric: oldstyle-nums; }
.sheet .body { overflow-y: auto; padding: 4px 14px 16px; }
.sheet .lane { border-bottom: 1px solid var(--rule-soft); padding: 8px 0; }
.sheet .lane > button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; cursor: pointer; text-align: left; font: 500 13px var(--font-ui); color: var(--ink); }
.sheet .lane > button .n { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.sheet .sq { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sheet .mini { display: block; width: 100%; height: 14px; margin: 5px 0 4px; }
.sheet ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.sheet li { display: grid; grid-template-columns: 11.5ch 1fr; gap: 8px; font: 14px/1.35 var(--font-read); }
.sheet li .y { color: var(--muted); font-variant-numeric: oldstyle-nums tabular-nums; font-size: 13px; }
.sheet .empty { font: italic 14px var(--font-read); color: var(--muted); }
.sheet .more { font-size: 12px; color: var(--focus); }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>

<div class="proto">
  <div class="pbar">
    <h1>Polity overview <span>Phase 4 prototype · Classical Greece fixture plus a generated world (test data)</span></h1>
  </div>
  <div class="pbar controls" role="group" aria-label="Prototype controls">
    <fieldset class="seg device-seg"><legend>Device</legend><span class="opts"><button id="dev-laptop" data-set="device" data-v="laptop">Laptop</button><button id="dev-phone" data-set="device" data-v="phone">Phone</button></span></fieldset>
    <fieldset class="seg"><legend>Theme</legend><span class="opts"><button id="th-auto" data-set="theme" data-v="auto">Auto</button><button id="th-light" data-set="theme" data-v="light">Light</button><button id="th-dark" data-set="theme" data-v="dark">Dark</button></span></fieldset>
    <fieldset class="seg"><legend>World events</legend><span class="opts"><button id="we-row" data-set="world" data-v="row">A · Own row</button><button id="we-place" data-set="world" data-v="place">B · In place</button></span></fieldset>
    <fieldset class="seg"><legend>Order</legend><span class="opts"><button id="or-auto" data-set="order" data-v="auto">A · Automatic</button><button id="or-drag" data-set="order" data-v="drag">B · Drag</button></span></fieldset>
    <fieldset class="seg"><legend>Threads</legend><span class="opts"><button id="thr-rib" data-set="threads" data-v="ribbons">A · Ribbons</button><button id="thr-arc" data-set="threads" data-v="arcs">B · Arcs</button></span></fieldset>
    <label class="check"><input type="checkbox" id="allthreads"> Show all threads</label>
  </div>
  <div class="pbar weights" role="group" aria-label="Prominence weights">
    <span class="lbl">Prominence</span>
    <label>each highlight × <input type="range" id="w-h" min="0" max="6" step="1"><output id="o-h"></output></label>
    <label>each connection × <input type="range" id="w-c" min="0" max="6" step="1"><output id="o-c"></output></label>
    <label>each note × <input type="range" id="w-n" min="0" max="6" step="1"><output id="o-n"></output></label>
    <label>shown in the overview + <input type="range" id="w-m" min="0" max="30" step="2"><output id="o-m"></output></label>
  </div>
  <div class="steps" role="group" aria-label="Walk through">
    <span class="lbl">Walk through</span>
    <button id="s1" data-step="1">1 · Athens in 431 BCE</button>
    <button id="s2" data-step="2">2 · Open Athens</button>
    <button id="s3" data-step="3">3 · Open its War lane</button>
    <button id="s4" data-step="4">4 · Fold Classical Greece</button>
    <button id="s5" data-step="5">5 · Click Persia on the map</button>
    <button id="s6" data-step="6">6 · Play 480 → 400 BCE</button>
    <button id="s7" data-step="7">7 · All of history</button>
    <button id="s8" data-step="8">8 · Open the Reformation</button>
    <button id="s9" data-step="9">9 · Athens’ threads</button>
  </div>
  <p class="pnote" id="note" aria-live="polite"></p>
  <div class="stage">
    <div class="device" id="device">
      <div class="app" id="app">
        <div class="topbar">
          <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
          <span class="yearbox"><button class="iconbtn" id="play" aria-label="Play">▶</button><span class="yr" id="yr"></span></span>
          <span class="zoomstops" role="group" aria-label="Zoom to"><button id="z-all" data-zoom="all">All</button><button id="z-ant" data-zoom="ant">Antiquity</button><button id="z-cl" data-zoom="cl">Classical</button><button id="z-med" data-zoom="med">Middle Ages</button></span>
        </div>
        <div class="mapwrap" id="mapwrap">
          <svg id="map" role="img" aria-label="Map at the year shown"></svg>
          <div class="maplegend" id="maplegend"></div>
          <div class="focuschip" id="focuschip" hidden></div>
        </div>
        <div class="tl" id="tl">
          <div class="tlhead" id="tlhead"><svg id="head"></svg></div>
          <div class="tlbody" id="tlbody" tabindex="0" aria-label="Timeline. Drag or shift-scroll to move through time; Ctrl or ⌘ and scroll to zoom."><svg id="body"></svg></div>
          <div class="hint">Drag to move · ⌘/Ctrl-scroll to zoom · Esc to go back</div>
        </div>
        <div class="sheet" id="sheet" aria-hidden="true"><header><h2 id="sh-title"></h2><span class="d" id="sh-dates"></span><button class="iconbtn" id="sh-close">Back</button></header><div class="body" id="sh-body"></div></div>
        <div class="tip" id="tip" hidden></div>
      </div>
    </div>

// ---------- strength: thickness from area, or Bob's points ----------
const snapAt = (p, y) => { let s = null; for (const x of p.snapshots) if (x.from <= y) s = x; return s ?? p.snapshots[0]; };

let drag = null;
const pointers = new Map();
function hitAt(e) { return e.target.closest?.('[data-pol],[data-group],[data-openpol],[data-lanebtn],[data-entry],[data-world],[data-handle]'); }
tb.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const h = e.target.closest('[data-handle]');
  if (h) { drag = { kind: 'reorder', rid: h.dataset.handle, y: e.clientY, moved: 0 }; tb.setPointerCapture(e.pointerId); return; }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; drag = { kind: 'pinch', d: Math.abs(a.x - b.x), t0: st.t0, t1: st.t1, cx: (a.x + b.x) / 2 }; return; }
  drag = { kind: 'pan', x: e.clientX, t0: st.t0, t1: st.t1, moved: 0, target: hitAt(e) };
});
tb.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return hover(e);
  if (drag.kind === 'reorder') {
    const dy = e.clientY - drag.y;
    if (Math.abs(dy) > 26) { moveRegion(drag.rid, dy > 0 ? 1 : -1); drag.y = e.clientY; }
    return;
  }
  const W = tb.clientWidth;
  if (drag.kind === 'pinch' && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const k = drag.d / Math.max(20, Math.abs(a.x - b.x));
    const r = tb.getBoundingClientRect(), c = drag.t0 + ((drag.cx - r.left) / W) * (drag.t1 - drag.t0);
    setWindow(c - (c - drag.t0) * k, c + (drag.t1 - c) * k); return;
  }
  if (drag.kind !== 'pan') return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 4) { drag.moved = 1; tb.classList.add('dragging'); $('tip').hidden = true; }
  if (!drag.moved) return;
  const dt = (dx / W) * (drag.t1 - drag.t0);
  setWindow(drag.t0 - dt, drag.t1 - dt);
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  tb.classList.remove('dragging');
  if (drag?.kind === 'pan' && !drag.moved) click(drag.target);
  drag = null;
};
tb.addEventListener('pointerup', endPointer);
tb.addEventListener('pointercancel', () => { pointers.clear(); drag = null; tb.classList.remove('dragging'); });
tb.addEventListener('pointerleave', () => { if (!drag) $('tip').hidden = true; });
tb.addEventListener('dblclick', (e) => { const h = e.target.closest('[data-pol]'); if (h) openThing({ type: 'pol', id: h.dataset.pol }); });
tb.addEventListener('wheel', (e) => {
  const W = tb.clientWidth;
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const r = tb.getBoundingClientRect(), c = Yr(e.clientX - r.left, W), k = Math.exp(e.deltaY * 0.0022);
    setWindow(c - (c - st.t0) * k, c + (st.t1 - c) * k);
  } else if (Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey) {
    e.preventDefault();
    const dt = ((e.shiftKey ? e.deltaY : e.deltaX) / W) * (st.t1 - st.t0);
    setWindow(st.t0 + dt, st.t1 + dt);
  }
}, { passive: false });
function setWindow(a, b) {
  const span = clamp(b - a, 30, T_MAX - T_MIN + 200);
  const mid = (a + b) / 2;
  st.t0 = clamp(mid - span / 2, T_MIN - 100, T_MAX + 100 - span); st.t1 = st.t0 + span; st.zoom = null;
  draw();
}
function click(t) {
  if (!t) { return; }
  const d = t.dataset;
  if (d.openpol) return openThing({ type: 'pol', id: d.openpol });
  if (d.lanebtn) return toggleLane(d.lanebtn);
  if (d.group) return toggleGroup(d.group);
  if (d.world) { const sel = { type: 'world', id: d.world }; return st.picked?.type === 'world' && st.picked.id === d.world ? openThing(sel) : pick(sel); }
  if (d.pol) { const sel = { type: 'pol', id: d.pol }; return st.picked?.type === 'pol' && st.picked.id === d.pol ? (st.open?.id === d.pol ? closeOpen() : openThing(sel)) : pick(sel); }
}
// The header: drag the year pill or click the axis to set the year; world events and shown entries pick.
const head = $('tlhead');
let yearDrag = false;
head.addEventListener('pointerdown', (e) => {
  const r = head.getBoundingClientRect(), W = r.width;
  if (e.target.closest('[data-yearhandle],[data-axis]')) { stop(); yearDrag = true; head.setPointerCapture(e.pointerId); st.year = clamp(Yr(e.clientX - r.left, W), T_MIN, T_MAX); draw(); return; }
  const w = e.target.closest('[data-world]');
  if (w) click(w);
});
head.addEventListener('pointermove', (e) => { if (!yearDrag) return hover(e); const r = head.getBoundingClientRect(); st.year = clamp(Yr(e.clientX - r.left, r.width), T_MIN, T_MAX); draw(); });
head.addEventListener('pointerup', () => { if (yearDrag) { yearDrag = false; refit(); } });
head.addEventListener('pointerleave', () => ($('tip').hidden = true));
$('mapwrap').addEventListener('pointermove', hover);
$('mapwrap').addEventListener('pointerleave', () => ($('tip').hidden = true));

// Tooltips (laptop only).
let hoverTimer = 0;
function hoverThreads(pid) {
  if (st.device === 'phone' || st.step === 9) return;
  if ((st.threadFocus ?? null) === (pid ?? null)) { clearTimeout(hoverTimer); return; }
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => { st.threadFocus = pid; draw(); }, pid ? 220 : 120);
}
function hover(e) {
  const tip = $('tip');
  if (e.currentTarget === tb || e.target.closest?.('#tlbody')) hoverThreads(e.target.closest?.('[data-pol]')?.dataset.pol ?? null);
  if (st.device === 'phone' || e.pointerType === 'touch') { tip.hidden = true; return; }
  const t = e.target.closest?.('[data-pol],[data-entry],[data-world],[data-group],[data-mpol]');
  if (!t) { tip.hidden = true; return; }
  const d = t.dataset;
  let html = '';
  if (d.pol || d.mpol) {
    const p = pol.get(d.pol ?? d.mpol), y = d.pol ? Yr(e.clientX - tb.getBoundingClientRect().left, tb.clientWidth) : st.year, yy = clamp(y, p.from, p.to);
    const why = p.strength ? `Bob’s strength ${levelAt(p, yy).toFixed(1).replace('.0', '')} of 5 in ${fmtY(yy)}` : snapAt(p, yy).areaKm2 ? `From its area in ${fmtY(yy)}: ${Math.round(areaAt(p, yy)).toLocaleString('en')} km²` : 'Strength unknown: one even width';
    const n = (entriesOf.get(p.id) ?? []).length;
    html = `<div class="tt">${esc(p.title)}</div><div class="td">${esc(fmtSpan(p.from, p.to))}${p.approxFrom ? ' (start approximate)' : ''}</div><div class="pr">${esc(why)}</div><div class="pr">${n} entr${n === 1 ? 'y' : 'ies'} · ${esc(p.region)}</div>${p.fixture ? '' : '<div class="gen">Extent: present-day borders as a stand-in (test data)</div>'}`;
  } else if (d.group) {
    const g = groups.get(d.group);
    html = `<div class="tt">${esc(g.title)}</div><div class="pr">${g.members.map((m) => esc(pol.get(m).title)).join(', ')}</div><div class="pr">Click to ${(st.f.groups[g.id] ?? 0) > 0.5 ? 'fold' : 'unfold'}.</div>`;
  } else {
    const o = entry.get(d.entry ?? d.world);
    if (!o) { tip.hidden = true; return; }
    const lanes = (o.lanes ?? []).map((l) => `<span class="chip" style="color:var(--${l})">${esc(laneById[l].name)}</span>`).join('');
    const who = (o.polities ?? []).map((p) => pol.get(p).title).join(', ');
    html = `<div class="tt">${esc(o.title)}</div><div class="td">${esc(fmtSpan(o.start, o.end))}${who ? ' · ' + esc(who) : ''}${o.overview === 'world' ? ' · world event' : ''}</div><div class="chips">${lanes}</div><div class="pr">${esc(promWhy(o))}</div>${o.gen ? '<div class="gen">Generated test entry</div>' : ''}`;
  }
  tip.innerHTML = html; tip.hidden = false;
  const app = $('app').getBoundingClientRect();
  let x = e.clientX - app.left + 14, y = e.clientY - app.top + 14;
  if (x + 300 > app.width) x = e.clientX - app.left - 310;
  if (y + tip.offsetHeight > app.height - 8) y = e.clientY - app.top - tip.offsetHeight - 10;
  tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
}

// ---------- start ----------
// On a narrow screen the device is the phone, whatever was chosen on a wide one.
const narrow = matchMedia('(max-width: 720px)');
const followWidth = () => { if (narrow.matches) st.device = 'phone'; else st.device = store.get('device', 'laptop'); drawChrome(); };
narrow.addEventListener?.('change', () => { followWidth(); drawNow(); refit(true); });
initMap();
followWidth();
document.fonts?.ready.then(() => { measureCache.clear(); drawNow(); });
new ResizeObserver(() => { draw(); }).observe($('device'));
st.zoom = 'cl';
step(1);
refit(true);
window.__overview = { st, autoOrder, step, D, links, regionCentre };
})();
</script>
