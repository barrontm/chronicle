<style>
/* Layout: a quiet desk holding one device (laptop or phone); inside it, Chronicle's own tokens from src/ui/styles.css. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8;
  --band: #e2e6df; --band-edge: #c3c9c0;
  --pol: #2f5da8; --eco: #b8860b; --soc: #a33b6b; --tec: #2e8b74; --int: #4b3f8c; --rel: #c23b22; --umber: #7a5a3a;

  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
    --band: #1e2832; --band-edge: #36444f;
    --pol: #6f93d6; --eco: #dcae45; --soc: #d06d9a; --tec: #58b89d; --int: #9184d6; --rel: #e0664c; --umber: #b9936b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0;
  --band: #1e2832; --band-edge: #36444f;
  --pol: #6f93d6; --eco: #dcae45; --soc: #d06d9a; --tec: #58b89d; --int: #9184d6; --rel: #e0664c; --umber: #b9936b;

* { box-sizing: border-box; }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- prototype chrome (outside the device) ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; letter-spacing: .01em; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-left: auto; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; border: 1px solid var(--band-edge); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--band-edge); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 80ch; min-height: 3em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 2px; }
.stage { display: flex; justify-content: center; min-width: 0; }

.device { position: relative; width: min(1240px, 100%); height: 760px; border: 1px solid var(--band-edge); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 82vh; min-height: 640px; border: 1px solid var(--band-edge); border-radius: 12px; }
}

/* ---------- the app inside ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--rule); background: var(--panel); flex: none; }
.crumbs { display: flex; align-items: baseline; gap: 6px; min-width: 0; font: 15px/1 var(--font-read); white-space: nowrap; overflow: hidden; }
.crumbs button { border: 0; background: none; padding: 4px 0; cursor: pointer; font: inherit; color: var(--ink-2); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.crumbs .here { font: 600 15px/1 var(--font-sc); letter-spacing: .05em; color: var(--ink); }
.crumbs .sep { color: var(--muted); }
.crumbs .cd { font-size: 13px; color: var(--muted); font-variant-numeric: oldstyle-nums; }
.zoomstops { margin-left: auto; display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; flex: none; }
.zoomstops button { border: 0; background: none; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.zoomstops button + button { border-left: 1px solid var(--rule); }
.zoomstops button[aria-pressed="true"] { background: var(--rule-soft); color: var(--ink); font-weight: 600; }
.zoomstops button:disabled { cursor: default; color: var(--muted); opacity: .6; }

.canvas { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.l0, .l1 { position: absolute; inset: 0; }
.l0 { overflow-x: hidden; overflow-y: auto; touch-action: pan-y; cursor: grab; }
.l0.dragging { cursor: grabbing; }
.l0 .streams { position: absolute; left: 0; top: 0; pointer-events: none; }
.l0-spacer { position: absolute; left: 0; top: 0; width: 1px; }
.row { position: absolute; left: 0; right: 0; transition: opacity var(--motion-quick) linear; }
.row-label { position: absolute; left: 0; top: 0; bottom: 0; width: 124px; padding: 10px 10px 0 14px; background: var(--bg); z-index: 2; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--rule-soft); }
.rname { font: 600 13px/1.1 var(--font-sc); letter-spacing: .12em; color: var(--ink-2); }
.rcount { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.is-phone .row-label { bottom: auto; width: auto; flex-direction: row; align-items: baseline; gap: 8px; padding: 4px 12px 0; background: none; border: 0; }

.band { position: absolute; display: flex; flex-direction: column; gap: 2px; padding: 6px 8px 11px; background: var(--panel); border: 1px solid var(--band-edge); border-radius: 3px; cursor: zoom-in; overflow: hidden; text-align: left; transition: border-color var(--motion-quick), box-shadow var(--motion-quick); }
.band:hover { border-color: var(--ink-2); box-shadow: 0 1px 0 var(--band-edge); }
.band.approx-from { border-left-style: dashed; border-left-color: var(--umber); }
.band.approx-to { border-right-style: dashed; border-right-color: var(--umber); }
.era-name { font: 600 15px/1.15 var(--font-sc); letter-spacing: .05em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.era-dates { font: 12.5px/1.2 var(--font-read); color: var(--muted); font-variant-numeric: oldstyle-nums; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 1px 6px 1px 5px; border: 1px solid var(--rule); border-radius: 3px; background: var(--bg); font: 12.5px/1.3 var(--font-read); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.chip i { flex: none; width: 7px; height: 7px; background: var(--c); border-radius: 1px; }
.chip em { font: normal 10.5px/1 var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--c); }
.chip.more { color: var(--muted); font-style: italic; }
.mix { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: flex; }
.mix i { display: block; height: 100%; }

/* B · streams: the band is a transparent window on the stream drawn in SVG */
.v0-B .band { background: transparent; border-color: transparent; border-radius: 0; padding: 5px 9px; }
.v0-B .band:hover { border-color: transparent; box-shadow: none; background: color-mix(in srgb, var(--ink) 5%, transparent); }
.v0-B .band .era-dates { display: none; }

.v0-B .band.thin .chips { display: none; }
.era-n { display: none; margin-left: 6px; font: 500 10.5px/1 var(--font-ui); letter-spacing: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.v0-B .era-n { display: inline; }
.streams path.stream { fill: var(--band); stroke: var(--band-edge); stroke-width: 1; }
.streams path.seam { stroke: var(--bg); stroke-width: 2; fill: none; }

/* level 1 */
.l1 { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.l1[hidden] { display: none !important; }
.l1-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 14px; border-bottom: 1px solid var(--rule-soft); }
.l1-head .lbl { flex: none; width: 110px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.l1-head .chips { margin: 0; flex: 1; min-width: 0; }
.l1-head .chip { font-size: 13.5px; padding: 2px 7px 2px 6px; }
.l1-head .chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
.l1-head .note { font: italic 13px/1.3 var(--font-read); color: var(--muted); }
.lanes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lane { position: relative; flex: 1 1 0; min-height: 0; border-bottom: 1px solid var(--rule-soft); background: color-mix(in srgb, var(--c) 4%, var(--bg)); }
.lane:last-child { border-bottom: 0; }
.lane-label { position: absolute; left: 0; top: 0; bottom: 0; width: 124px; padding: 10px 10px 0 14px; z-index: 2; background: var(--bg); border-right: 1px solid var(--rule-soft); display: flex; flex-direction: column; gap: 3px; }
.lane-label .dname { display: flex; align-items: center; gap: 7px; font: 600 12px/1.1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.lane-label .dname i { width: 9px; height: 9px; background: var(--c); border-radius: 1px; flex: none; }
.lane-label .dcount { font-size: 11px; color: var(--muted); padding-left: 16px; font-variant-numeric: tabular-nums; }
.track { position: absolute; inset: 0; }
.phase { position: absolute; height: 20px; display: flex; align-items: center; padding: 0 7px; background: color-mix(in srgb, var(--c) 16%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); border-radius: 2px; cursor: pointer; transition: opacity var(--motion-quick); }
.phase.approx { border-style: dashed; }
.phase:hover { background: color-mix(in srgb, var(--c) 26%, var(--panel)); }
.phase span { min-width: 0; font: 13px/1 var(--font-read); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phase.out span { position: absolute; left: calc(100% + 6px); color: var(--ink-2); overflow: visible; }
.phase.nolabel span { display: none; }
.moment { position: absolute; top: 7px; display: flex; align-items: center; gap: 5px; height: 14px; cursor: pointer; white-space: nowrap; transition: opacity var(--motion-quick); }
.moment i { width: 9px; height: 9px; background: var(--c); transform: rotate(45deg); flex: none; border: 1.5px solid var(--bg); box-sizing: content-box; margin-left: -6px; }
.moment span { font: 11.5px/1 var(--font-ui); color: var(--ink-2); }
.moment.flip { flex-direction: row-reverse; }
.moment.flip i { margin-left: 0; margin-right: -6px; }
.moment.nolabel span { display: none; }
.is-phone .moment span, .is-phone .phase span { display: none; }
.is-phone .phase { background: color-mix(in srgb, var(--c) 30%, var(--panel)); }
.is-phone .crumbs .cd, .is-phone .crumbs .sep { display: none; }
.is-phone .zoomstops button { padding: 5px 7px; font-size: 11.5px; }
.moment:hover span { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.pulse { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.pulse .area { fill: color-mix(in srgb, var(--c) 24%, transparent); stroke: var(--c); stroke-width: 1.5; }
.pulse .base { stroke: color-mix(in srgb, var(--c) 40%, transparent); stroke-width: 1; }
.peak { position: absolute; transform: translate(-50%, -100%); font: italic 13px/1.1 var(--font-read); color: var(--ink); white-space: nowrap; cursor: pointer; padding: 1px 3px; background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: 2px; transition: opacity var(--motion-quick); }
.peak:hover { text-decoration: underline; text-underline-offset: 2px; }
.empty { position: absolute; left: 140px; top: 50%; transform: translateY(-50%); margin: 0; font: italic 14px/1.3 var(--font-read); color: var(--muted); }
.l1.focusing .phase:not(.in), .l1.focusing .moment:not(.in), .l1.focusing .peak:not(.in) { opacity: .22; }
.l1.focusing .phase.in { box-shadow: 0 0 0 2px var(--c); }
.tip { position: absolute; z-index: 5; pointer-events: none; padding: 4px 7px; background: var(--ink); color: var(--panel); font-size: 11.5px; border-radius: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* phone level 1: lanes become a scrolling list */
.is-phone .l1-head { flex-wrap: wrap; padding: 8px 12px; }
.is-phone .l1-head .lbl { width: auto; }
.is-phone .l1-head .chips { flex-basis: 100%; }
.is-phone .lanes { overflow-y: auto; display: block; }
.is-phone .lane { flex: none; padding-bottom: 8px; }
.is-phone .lane-label { position: static; width: auto; flex-direction: row; align-items: baseline; gap: 8px; padding: 10px 12px 2px; background: none; border: 0; }
.is-phone .lane-label .dcount { padding: 0; }
.is-phone .track { position: relative; inset: auto; height: 80px; }
.is-phone .empty { position: static; transform: none; padding: 0 12px 6px; font-size: 13.5px; }
.lane-list { list-style: none; margin: 2px 0 0; padding: 0 12px; display: grid; gap: 1px; }
.lane-list button { display: grid; grid-template-columns: 74px 1fr; gap: 8px; width: 100%; border: 0; background: none; padding: 5px 0; text-align: left; cursor: pointer; font: 14px/1.3 var(--font-read); color: var(--ink); }
.lane-list .ly { font: 11.5px/1.6 var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.lane-list .m::before { content: ''; display: inline-block; width: 7px; height: 7px; background: var(--c); transform: rotate(45deg); margin-right: 7px; vertical-align: 1px; }

.axis { position: relative; flex: none; height: 30px; border-top: 1px solid var(--rule); background: var(--panel); overflow: hidden; }
.tick { position: absolute; top: 0; height: 100%; padding-top: 7px; font: 12.5px/1 var(--font-read); color: var(--ink-2); font-variant-numeric: oldstyle-nums; white-space: nowrap; transform: translateX(-50%); }
.tick::before { content: ''; position: absolute; left: 50%; top: 0; height: 4px; border-left: 1px solid var(--rule); }
.axis.l1ticks .tick { font: 11px/1 var(--font-ui); font-variant-numeric: tabular-nums; padding-top: 9px; }

.panel { position: absolute; top: 46px; right: 0; bottom: 30px; width: 360px; z-index: 6; background: var(--panel); border-left: 1px solid var(--rule); box-shadow: -14px 0 30px -22px rgb(0 0 0 / .4); padding: 18px 20px; overflow-y: auto; transform: translateX(105%); visibility: hidden; transition: transform var(--motion-move) var(--ease), visibility 0s linear var(--motion-move); }
.panel.open { transform: none; visibility: visible; transition: transform var(--motion-move) var(--ease), visibility 0s; }
.is-phone .panel { top: auto; left: 0; width: auto; max-height: 64%; bottom: 0; border-left: 0; border-top: 1px solid var(--rule); border-radius: 14px 14px 0 0; transform: translateY(105%); box-shadow: 0 -14px 30px -22px rgb(0 0 0 / .4); padding-top: 22px; }
.is-phone .panel.open { transform: none; }
.is-phone .panel::before { content: ''; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--rule); }
.panel .close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 4px; }
.panel .close:hover { background: var(--rule-soft); color: var(--ink); }
.panel h2 { font: 500 22px/1.2 var(--font-read); margin: 0 30px 6px 0; text-wrap: balance; }
.panel .meta { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; }
.panel .meta i { width: 9px; height: 9px; background: var(--c); border-radius: 1px; }
.panel .count { font-size: 12px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; }
.panel blockquote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 2px solid var(--c); font: 16px/1.5 var(--font-read); }
.panel cite { display: block; margin-top: 4px; font: normal 11.5px/1.3 var(--font-ui); color: var(--muted); }
.panel .more { font: italic 14px/1.4 var(--font-read); color: var(--muted); margin: 0 0 16px; }
.panel .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.panel .actions button { border: 1px solid var(--rule); background: var(--bg); padding: 6px 11px; border-radius: 4px; font-size: 12.5px; }
.panel .actions button:disabled { color: var(--muted); }
.panel .fine { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
.panel ul { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 2px; }
.panel li button { display: grid; grid-template-columns: 12px 1fr auto; align-items: baseline; gap: 8px; width: 100%; padding: 6px 4px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 3px; }
.panel li button:hover { background: var(--rule-soft); }
.panel li i { width: 8px; height: 8px; background: var(--c); border-radius: 1px; }
.panel li .t { font: 15px/1.3 var(--font-read); }
.panel li .y { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>

<div class="proto">
  <header class="pbar">
    <h1>Era overview <span>Phase 0 prototype · sample data</span></h1>
    <div class="controls">
      <fieldset class="seg" id="v0"><legend>Eras</legend><span class="opts"><button data-v="A" aria-pressed="true">A · Bands</button><button data-v="B" aria-pressed="false">B · Streams</button></span></fieldset>
      <fieldset class="seg" id="v1"><legend>Dimensions</legend><span class="opts"><button data-v="A" aria-pressed="true">A · Phases</button><button data-v="B" aria-pressed="false">B · Pulse</button></span></fieldset>
      <fieldset class="seg device-seg" id="dev"><legend>Device</legend><span class="opts"><button data-v="laptop" aria-pressed="true">Laptop</button><button data-v="phone" aria-pressed="false">Phone</button></span></fieldset>
      <fieldset class="seg" id="thm"><legend>Theme</legend><span class="opts"><button data-v="light" aria-pressed="false">Light</button><button data-v="dark" aria-pressed="false">Dark</button></span></fieldset>
    </div>
  </header>

      <div class="app" id="app">

            <button id="crumbHome" type="button">All eras</button>

        </aside>
      </div>
    </div>

<script>
(() => {
'use strict';
// ---------- dates: astronomical years, as in src/model/dates.ts (431 BCE = -430) ----------
const bce = n => 1 - n;
const fmtY = y => y <= 0 ? `${1 - y} BCE` : `${y} CE`;
const fmtRange = (a, b) => b == null ? fmtY(a)
  : (a <= 0 && b <= 0) ? `${1 - a}–${1 - b} BCE`
  : a > 0 ? `${a}–${b} CE` : `${fmtY(a)} – ${fmtY(b)}`;

seg('v1', v => { S.v1 = v; if (S.level === 1) renderRest(); else syncChrome(); });
seg('dev', v => { device.classList.toggle('phone', v === 'phone'); S.home = null; if (S.level === 0) S.dom = homeDomain(); closePanel(); renderRest(); });
const thm = seg('thm', v => { document.documentElement.dataset.theme = v; });
const darkNow = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
thm.querySelector(`[data-v="${darkNow() ? 'dark' : 'light'}"]`).setAttribute('aria-pressed', 'true');

let lastW = 0;
new ResizeObserver(() => {
  const w = canvas.clientWidth; if (!w || w === lastW || S.busy) return;
  const wasPhone = app.classList.contains('is-phone');
  lastW = w;
  if (wasPhone !== isPhone()) { S.home = null; if (S.level === 0) S.dom = homeDomain(); }
  renderRest();
}).observe(canvas);

buildL0();
renderRest();
document.fonts && document.fonts.ready.then(() => { widthCache.clear(); renderRest(); });
})();
