<title>Chronicle Athenian economy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a quiet desk holding one device (laptop or phone); inside it, Chronicle's own tokens from src/ui/styles.css.
   Everything economic takes ochre; textures say how the work was done. */
:root {
  --desk: #dfe3dc; --desk-ink: #35424d; --frame: #1d2b3a;
  --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2b3a; --ink-2: #4d5b66; --muted: #74808a;
  --rule: #cfd4cc; --rule-soft: #e1e4dd; --focus: #2f5da8; --band: #e2e6df; --band-edge: #c3c9c0;
  --eco: #b8860b; --eco-ink: #7d5b06; --umber: #7a5a3a; --pol: #2f5da8;
  --map-water: #c9d6d8; --map-land: #ece4cf; --map-border: #a9a48f; --grat: #b7c6c9;
  --font-read: 'Spectral', Georgia, serif;
  --font-sc: 'Spectral SC', 'Spectral', Georgia, serif;
  --font-ui: 'Public Sans', system-ui, sans-serif;
  --motion-quick: 150ms; --motion-move: 400ms; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
    --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
    --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --band: #1e2832; --band-edge: #36444f;
    --eco: #dcae45; --eco-ink: #f0cd7a; --umber: #b9936b; --pol: #6f93d6;
    --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1116; --desk-ink: #b7bfbf; --frame: #2a3540;
  --bg: #131b23; --panel: #1a242e; --ink: #e3e6e0; --ink-2: #b7bfbf; --muted: #8a959b;
  --rule: #33414d; --rule-soft: #26323d; --focus: #7fa3e0; --band: #1e2832; --band-edge: #36444f;
  --eco: #dcae45; --eco-ink: #f0cd7a; --umber: #b9936b; --pol: #6f93d6;
  --map-water: #0f1820; --map-land: #2a2f2c; --map-border: #4a524b; --grat: #1c2a35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- prototype chrome (outside the device) ---------- */
.proto { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; color: var(--desk-ink); }
.pbar h1 { font: 600 15px/1.2 var(--font-ui); margin: 0; letter-spacing: .01em; }
.pbar h1 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-left: auto; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { float: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding: 0; }
.seg .opts { display: inline-flex; border: 1px solid var(--band-edge); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--band-edge); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.pnote { margin: 0; font: 14px/1.5 var(--font-read); color: var(--desk-ink); max-width: 84ch; min-height: 4.5em; }
.pnote b { font-weight: 600; }
.pnote .how { display: block; font: 12.5px/1.5 var(--font-ui); color: var(--muted); margin-top: 3px; }
.stage { display: flex; justify-content: center; min-width: 0; }
.device { position: relative; width: min(1240px, 100%); height: 800px; border: 1px solid var(--band-edge); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); }
.device.phone { width: 412px; max-width: 100%; height: 860px; border: 9px solid var(--frame); border-radius: 34px; }
@media (max-width: 720px) {
  .seg.device-seg { display: none; }
  .device, .device.phone { width: 100%; height: 82vh; min-height: 640px; border: 1px solid var(--band-edge); border-radius: 12px; }
}

/* ---------- the app inside ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.topbar { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--rule); background: var(--panel); flex: none; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; font: 15px/1 var(--font-read); }
.crumbs .p { font: 600 15px/1 var(--font-sc); letter-spacing: .05em; color: var(--ink-2); }
.crumbs .sep { color: var(--muted); }
.crumbs .here { font: 500 15px/1 var(--font-read); }
.crumbs .kind { font: 11.5px/1 var(--font-ui); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.crumbs i { width: 9px; height: 9px; background: var(--eco); border-radius: 1px; flex: none; }

.scroll { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.main { position: relative; flex: 1; min-height: 0; display: flex; }
.mapbox { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--map-water); }
.mapbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.land { fill: var(--map-land); stroke: var(--map-border); stroke-width: .8; vector-effect: non-scaling-stroke; }
.grat { stroke: var(--grat); fill: none; stroke-width: .8; vector-effect: non-scaling-stroke; }
.region { font-family: var(--font-sc); font-weight: 500; letter-spacing: .2em; fill: var(--muted); }
.water { font-family: var(--font-read); font-style: italic; fill: var(--muted); letter-spacing: .06em; }
.city { font-family: var(--font-read); fill: var(--ink); paint-order: stroke; stroke: var(--map-land); stroke-linejoin: round; }
.flabel { font-family: var(--font-read); font-style: italic; fill: var(--eco-ink); paint-order: stroke; stroke: var(--map-water); stroke-linejoin: round; }
.chan { fill: none; stroke: var(--eco); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.chan.unknown { stroke-dasharray: 5 4; }
.chan.cut { stroke: var(--muted); stroke-dasharray: 3 4; opacity: .7; }
.dot { fill: var(--eco); }
.dot.unknown { fill: var(--map-water); stroke: var(--eco); vector-effect: non-scaling-stroke; stroke-width: 1.4; }
.when { position: absolute; left: 14px; top: 12px; padding: 8px 12px 9px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--rule); border-radius: 4px; pointer-events: none; max-width: min(360px, calc(100% - 28px)); }
.when .y { font: 500 21px/1.1 var(--font-read); font-variant-numeric: oldstyle-nums; }
.when .snap { margin-top: 3px; font-size: 12px; color: var(--ink-2); }
.when .moment { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--rule-soft); font: 14px/1.4 var(--font-read); }
.when .moment b { display: block; font: 600 11px/1.3 var(--font-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--eco-ink); margin-bottom: 2px; }
.inset { position: absolute; right: 14px; bottom: 14px; width: 250px; height: 260px; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--map-water); box-shadow: 0 8px 22px -16px rgb(0 0 0 / .5); }
.inset > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.inset .ttl { position: absolute; left: 8px; top: 6px; font: 600 11px/1 var(--font-sc); letter-spacing: .16em; color: var(--ink-2); pointer-events: none; }
.site { stroke: var(--eco-ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.site.idle { fill: var(--map-land) !important; stroke: var(--muted); stroke-dasharray: 2 2; }
.site.hot { stroke: var(--ink); stroke-width: 2.4; }
.wall { stroke: var(--ink-2); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.mkey { position: absolute; left: 14px; bottom: 12px; display: grid; grid-template-columns: auto auto; gap: 4px 14px; padding: 6px 10px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--rule); border-radius: 4px; font-size: 11.5px; color: var(--ink-2); }
.mkey div { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tip { position: absolute; z-index: 9; pointer-events: none; padding: 5px 8px; background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.35; border-radius: 3px; white-space: nowrap; }
[data-hit] { cursor: pointer; }

/* portrait */
.portrait { flex: none; width: 390px; border-left: 1px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.phead { padding: 14px 18px 8px; }
.phead .kind { margin: 0 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.phead h2 { margin: 0; font: 500 21px/1.2 var(--font-read); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.phead h2 .c { font-size: 15px; color: var(--ink-2); font-variant-numeric: oldstyle-nums; }
.phead .measure { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.pbox { position: relative; height: 290px; margin: 4px 18px 0; flex: none; }
.pbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.t-name { font: 500 14px/1 var(--font-read); fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.t-val { font: 600 11.5px/1 var(--font-ui); fill: var(--ink); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.t-nat { font: 11px/1 var(--font-ui); fill: var(--ink-2); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.tile { cursor: pointer; }
.tile .unk { fill: var(--panel); stroke: var(--eco); stroke-dasharray: 4 3; }
.tile.sel rect.f { stroke: var(--ink); stroke-width: 2; }
.r-axis { font: 10.5px/1 var(--font-ui); fill: var(--muted); font-variant-numeric: tabular-nums; }
.r-grid { stroke: var(--rule-soft); }
.labkey { display: flex; flex-wrap: wrap; gap: 5px 12px; padding: 10px 18px 0; font-size: 11.5px; color: var(--ink-2); }
.labkey .hd { width: 100%; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.labkey span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.detail { padding: 12px 18px 18px; border-top: 1px solid var(--rule-soft); margin-top: 12px; }
.detail h3 { margin: 0 0 4px; font: 500 17px/1.25 var(--font-read); }
.detail .sub { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.detail p.sum { margin: 0 0 10px; font: 15px/1.45 var(--font-read); }
.detail blockquote { margin: 0 0 10px; padding: 2px 0 2px 12px; border-left: 2px solid var(--eco); font: 15px/1.5 var(--font-read); }
.detail cite { display: block; margin-top: 4px; font: normal 11.5px/1.3 var(--font-ui); color: var(--muted); }
.detail .none { margin: 0; font: italic 14px/1.4 var(--font-read); color: var(--muted); }
.detail .back { border: 0; background: none; padding: 0; margin: 0 0 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* the economic lane: sectors over time */
.lane { position: relative; flex: none; height: 132px; display: flex; border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--eco) 4%, var(--bg)); }
.lane-ctl { flex: none; width: 124px; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 10px 0 14px; border-right: 1px solid var(--rule-soft); background: var(--bg); }
.lane-ctl .dname { display: flex; align-items: center; gap: 7px; font: 600 12px/1.1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; }
.lane-ctl .dname i { width: 9px; height: 9px; background: var(--eco); border-radius: 1px; }
.lane-ctl .row { display: flex; gap: 5px; }
.lane-ctl button { height: 28px; min-width: 30px; border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; cursor: pointer; display: grid; place-items: center; padding: 0 6px; font-size: 11.5px; color: var(--ink-2); }
.lane-ctl .play { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 34px; }
.track { position: relative; flex: 1; min-width: 0; touch-action: none; cursor: ew-resize; }
.track > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.layer { stroke: var(--bg); stroke-width: 1; }
.s-lbl { font: 500 11px/1 var(--font-ui); fill: var(--ink); paint-order: stroke; stroke: color-mix(in srgb, var(--eco) 30%, var(--panel)); stroke-width: 2.5px; stroke-linejoin: round; pointer-events: none; }
.snapline { stroke: var(--umber); stroke-width: 1; opacity: .55; }
.snaplbl { font: 10.5px/1 var(--font-ui); fill: var(--umber); font-variant-numeric: tabular-nums; }
.mom { fill: var(--eco); stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }
.momhit { fill: transparent; cursor: pointer; }
.unrec { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }
.unrec-t { font: italic 12px/1 var(--font-read); fill: var(--muted); }
.head line { stroke: var(--ink); stroke-width: 1.5; }
.head circle { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.axis { position: relative; flex: none; height: 24px; margin-left: 124px; border-top: 1px solid var(--rule-soft); background: var(--panel); overflow: hidden; }
.axis span { position: absolute; top: 0; padding-top: 6px; font: 11px/1 var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; transform: translateX(-50%); white-space: nowrap; }
.axis span::before { content: ''; position: absolute; left: 50%; top: 0; height: 4px; border-left: 1px solid var(--rule); }

/* phone: one scrolling column */
.is-phone .scroll { overflow-y: auto; }
.is-phone .mapbox { flex: none; height: 330px; }
.is-phone .portrait { width: auto; border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
.is-phone .pbox { height: 270px; margin: 4px 12px 0; }
.is-phone .phead, .is-phone .labkey, .is-phone .detail { padding-left: 12px; padding-right: 12px; }
.is-phone .inset { width: 150px; height: 150px; right: 8px; bottom: 8px; }
.is-phone .when { left: 8px; top: 8px; padding: 6px 9px; }
.is-phone .when .y { font-size: 18px; }
.is-phone .when .moment { font-size: 13px; }
.is-phone .mkey { display: none; }
.is-phone .lane { height: 112px; }
.is-phone .lane-ctl { width: 92px; padding: 0 6px 0 10px; }
.is-phone .lane-ctl .dname { font-size: 10.5px; }
.is-phone .axis { margin-left: 92px; }
.is-phone .crumbs .kind { display: none; }
.is-phone .main { display: contents; }
.is-phone .mapbox { order: 1; }
.is-phone .lane { order: 2; }
.is-phone .axis { order: 3; }
.is-phone .portrait { order: 4; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="lab-free" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="color-mix(in srgb, var(--eco) 30%, var(--panel))"/></pattern>
    <pattern id="lab-paid" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="color-mix(in srgb, var(--eco) 26%, var(--panel))"/><rect x="2.3" width="1.4" height="6" fill="color-mix(in srgb, var(--eco) 78%, var(--panel))"/></pattern>
    <pattern id="lab-enslaved" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="color-mix(in srgb, var(--eco) 26%, var(--panel))"/><rect width="1.3" height="6" fill="color-mix(in srgb, var(--eco) 78%, var(--panel))"/><rect width="6" height="1.3" fill="color-mix(in srgb, var(--eco) 78%, var(--panel))"/></pattern>
    <pattern id="lab-mixed" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="color-mix(in srgb, var(--eco) 26%, var(--panel))"/><circle cx="3" cy="3" r="1.15" fill="color-mix(in srgb, var(--eco) 78%, var(--panel))"/></pattern>
  </defs>
</svg>

<div class="proto">
  <header class="pbar">
    <h1>Athens’ economy <span>Phase 0 prototype · sample data</span></h1>
    <div class="controls">
      <fieldset class="seg" id="vp"><legend>Portrait</legend><span class="opts"><button data-v="A" aria-pressed="true">A · Treemap</button><button data-v="B" aria-pressed="false">B · Ranges</button></span></fieldset>
      <fieldset class="seg" id="vl"><legend>Lane</legend><span class="opts"><button data-v="A" aria-pressed="true">A · Stream</button><button data-v="B" aria-pressed="false">B · Shares</button></span></fieldset>
      <fieldset class="seg device-seg" id="dev"><legend>Device</legend><span class="opts"><button data-v="laptop" aria-pressed="true">Laptop</button><button data-v="phone" aria-pressed="false">Phone</button></span></fieldset>
      <fieldset class="seg" id="thm"><legend>Theme</legend><span class="opts"><button data-v="light" aria-pressed="false">Light</button><button data-v="dark" aria-pressed="false">Dark</button></span></fieldset>
    </div>
  </header>
  <p class="pnote" id="pnote"></p>
  <main class="stage">
    <div class="device" id="device">
      <div class="app" id="app">
        <div class="topbar">
          <div class="crumbs"><i></i><span class="p">Athens</span><span class="sep">›</span><span class="here">Economy</span><span class="kind">Economy profile</span></div>
        </div>
        <div class="scroll" id="scroll">
          <div class="main order-1" id="main">
            <div class="mapbox" id="mapbox">
              <svg id="msvg" role="img" aria-label="Map of Athens' trade at the current year"><g id="mbase"><path class="land" id="mland"/><g id="mgrat"></g></g><g id="mdyn"></g></svg>
              <div class="when"><div class="y" id="wy"></div><div class="snap" id="wsnap"></div><div class="moment" id="wmom" hidden></div></div>
              <div class="inset" id="inset"><svg id="isvg" role="img" aria-label="Attica, with its production sites"><path class="land" id="iland"/><g id="idyn"></g></svg><span class="ttl">Attica</span></div>
              <div class="mkey" id="mkey"></div>
              <div class="tip" id="tip" hidden></div>
            </div>
            <aside class="portrait" id="portrait">
              <div class="phead"><p class="kind">Economy portrait</p><h2><span>Athens</span><span class="c" id="pc"></span></h2><p class="measure">Share of people working, by sector. Rough estimates; ranges show how unsure.</p></div>
              <div class="pbox" id="pbox"><svg id="psvg" role="img" aria-label="Sectors of Athens' economy"></svg></div>
              <div class="labkey" id="labkey"></div>
              <div class="detail" id="detail" aria-live="polite"></div>
            </aside>
          </div>
          <div class="lane order-2" id="lane">
            <div class="lane-ctl">
              <span class="dname"><i></i>Economic</span>
              <div class="row"><button id="play" class="play" type="button" aria-label="Play"></button><button id="speed" type="button" title="Speed">1×</button></div>
            </div>
            <div class="track" id="track"><svg id="tsvg"></svg></div>
          </div>
          <div class="axis order-2" id="axis"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// ---------- dates: astronomical years, as in src/model/dates.ts (431 BCE = -430) ----------
const bce = n => 1 - n;
const t = (y, f) => 1 - y + f;
const yr = T => { const a = Math.floor(T); return `${1 - a} BCE`; };

    if (placed.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    placed.push(box);
    o.push(`<text class="s-lbl" x="${f(x)}" y="${f(y)}" text-anchor="middle">${esc(sec.short || sec.name)}</text>`);
  }
  // snapshots: where the numbers come from
  for (const s of SNAPS) { const x = tx(s.c); o.push(`<line class="snapline" x1="${f(x)}" x2="${f(x)}" y1="14" y2="${f(bot)}"/>`); if (!isPhone() || s.c % 2 === 0) o.push(`<text class="snaplbl" x="${f(x + 3)}" y="${f(top - 2)}">${s.label.replace(' BCE', '')}</text>`); }
  // moments
  for (const m of MOMENTS) { const x = tx(m.t); o.push(`<g data-hit="mom:${m.id}"><rect class="mom" x="${f(x - 4.5)}" y="3.5" width="9" height="9" transform="rotate(45 ${f(x)} 8)"/><rect class="momhit" x="${f(x - 9)}" y="0" width="18" height="18"/></g>`); }
  o.push(`<rect class="unrec" x="${f(xEnd + 3)}" y="${f(top)}" width="${f(Math.max(0, W - xEnd - 4))}" height="${f(ih)}" rx="2"/>`);
  if (W - xEnd > 90) o.push(`<text class="unrec-t" x="${f(xEnd + 10)}" y="${f(top + ih / 2 + 4)}">not read yet</text>`);
  const hx = f(tx(S.T));
  o.push(`<g class="head"><line x1="${hx}" x2="${hx}" y1="14" y2="${H}"/><circle cx="${hx}" cy="17" r="4.5"/></g>`);
  tsvg.innerHTML = o.join('');
}
function renderAxis() {
  const o = [], W = track.clientWidth;
  for (let Y = 600; Y >= 300; Y -= 50) { const x = tx(bce(Y)); o.push(`<span style="left:${x.toFixed(1)}px${x > W - 14 ? ';transform:translateX(-100%)' : ''}">${Y}</span>`); }
  $('#axis').innerHTML = o.join('');
}

// ---------- year overlay ----------
function syncWhen() {
  const T = S.T, snap = snapAt(T);
  $('#wy').textContent = yr(T);
  $('#wsnap').textContent = snap ? `Portrait from ${snap.label} · ${snap.title}` : 'Not read yet';
  const m = [...MOMENTS].reverse().find(m => T >= m.t && T - m.t < 7);
  const box = $('#wmom');
  if (m) { box.hidden = false; box.innerHTML = `<b>${yr(m.t)} · ${esc(m.title)}</b>${esc(m.q[0])}`; } else box.hidden = true;
}

// ---------- clock ----------
let raf = 0, lastNow = 0;
const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
function frame(now) {
  raf = 0;
  const dt = Math.min(100, lastNow ? now - lastNow : 16); lastNow = now;
  if (S.playing && now >= S.dwellUntil) {
    const next = S.T + 11 * S.speed * dt / 1000;
    const m = MOMENTS.find(m => m.t > S.T && m.t <= next);
    if (m && !reduced.matches) { S.T = m.t + .001; S.dwellUntil = now + 2600; }
    else S.T = next;
    if (S.T >= UNREC) { S.T = UNREC - .01; setPlaying(false); }
  }
  renderMap(now); renderPortrait(now); renderTrack(); syncWhen();
  const flowing = !reduced.matches && FLOWS.some(f => { const s = flowState(f, S.T); return s && s.state === 'on'; });
  if (S.playing || pFrom || flowing) kick(); else lastNow = 0;
}
function setPlaying(on) {
  if (on && S.T >= UNREC - .5) S.T = D0;
  S.playing = on; S.dwellUntil = 0;
  const b = $('#play');
  b.setAttribute('aria-label', on ? 'Pause' : 'Play');
  b.innerHTML = on ? '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" fill="currentColor"/><rect x="7" y="1.5" width="3" height="9" fill="currentColor"/></svg>' : '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>';
  lastNow = 0; kick();
}
$('#play').addEventListener('click', () => setPlaying(!S.playing));
const SPEEDS = [[.5, '½×'], [1, '1×'], [2, '2×']];
$('#speed').addEventListener('click', () => { const i = (SPEEDS.findIndex(s => s[0] === S.speed) + 1) % SPEEDS.length; S.speed = SPEEDS[i][0]; $('#speed').textContent = SPEEDS[i][1]; });

// ---------- pointer: lane, portrait, map ----------
function showTip(ev, html) {
  const r = app.getBoundingClientRect();
  tip.innerHTML = html; tip.hidden = false;
  let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 8) x = ev.clientX - r.left - tip.offsetWidth - 10;
  if (y + tip.offsetHeight > r.height - 4) y = ev.clientY - r.top - tip.offsetHeight - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
// the tip lives in the app, not the map, so it can float over the lane too
app.appendChild(tip);
function hideTip() { tip.hidden = true; }
function setHover(id) { if (id !== S.hover) { S.hover = id; kick(); } }
let scrub = false;
track.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('[data-hit]');
  if (h && h.dataset.hit.startsWith('mom:')) { const m = MOMENTS.find(x => 'mom:' + x.id === h.dataset.hit); setPlaying(false); S.T = m.t + .001; kick(); return; }
  scrub = true; setPlaying(false); try { track.setPointerCapture(ev.pointerId); } catch {}
  S.T = Math.min(UNREC - .01, Math.max(D0, fromX(ev.clientX - track.getBoundingClientRect().left))); kick();
});
track.addEventListener('pointermove', ev => {
  const x = ev.clientX - track.getBoundingClientRect().left;
  if (scrub) { S.T = Math.min(UNREC - .01, Math.max(D0, fromX(x))); kick(); return; }
  const h = ev.target.closest('[data-hit]'), T = fromX(x);
  if (h && h.dataset.hit.startsWith('mom:')) { const m = MOMENTS.find(x => 'mom:' + x.id === h.dataset.hit); showTip(ev, `<b>${yr(m.t)}</b> · ${esc(m.title)}`); setHover(null); return; }
  if (h && SEC[h.dataset.hit]) {
    const s = SEC[h.dataset.hit], near = SNAPS.reduce((a, b) => Math.abs(b.c - T) < Math.abs(a.c - T) ? b : a);
    showTip(ev, `<b>${esc(s.name)}</b><br>${near.label}: ${!(s.id in near.v) ? 'not yet' : rangeTxt(near.v[s.id])} of people working`); setHover(s.id); return;
  }
  hideTip(); setHover(null);
});
track.addEventListener('pointerup', () => { scrub = false; });
track.addEventListener('pointerleave', () => { hideTip(); setHover(null); });
psvg.addEventListener('pointermove', ev => {
  const h = ev.target.closest('[data-hit]'); if (!h) { hideTip(); setHover(null); return; }
  const s = SEC[h.dataset.hit], snap = snapAt(S.T);
  showTip(ev, `<b>${esc(s.name)}</b> · ${!(s.id in snap.v) ? 'not yet' : rangeTxt(snap.v[s.id])}<br>${esc(s.labText)}${s.owner ? `; ${esc(s.owner)}` : ''}`); setHover(s.id);
});
psvg.addEventListener('pointerleave', () => { hideTip(); setHover(null); });
psvg.addEventListener('click', ev => { const h = ev.target.closest('[data-hit]'); if (!h) return; S.sel = S.sel === h.dataset.hit ? null : h.dataset.hit; renderDetail(); kick(); });
for (const el of [msvg, isvg]) {
  el.addEventListener('pointermove', ev => {
    const h = ev.target.closest('[data-hit]'); if (!h) { hideTip(); return; }
    const id = h.dataset.hit;
    if (id.startsWith('site:')) { const s = SITES.find(x => 'site:' + x.id === id); const on = active(s.on, S.T); showTip(ev, `<b>${esc(s.name)}</b><br>${esc(SEC[s.sec].name)} · ${on ? esc(SEC[s.sec].labText) : 'idle in these years'}`); return; }
    const f = FLOWS.find(x => x.id === id), st = flowState(f, S.T);
    showTip(ev, `<b>${esc(f.name)}</b><br>${st.state === 'cut' ? `Cut off: ${esc(st.why)}` : st.amount ? `About ${fmtN(st.amount)} ${f.unit} (Demosthenes)` : 'Amount unknown'}`);
  });
  el.addEventListener('pointerleave', hideTip);
}
document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('input, textarea')) return;
  if (ev.key === ' ') { ev.preventDefault(); setPlaying(!S.playing); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); const n = SNAPS.find(s => s.from > S.T); if (n) { S.T = n.c; kick(); } }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); const cur = snapAt(S.T); const i = cur ? SNAPS.indexOf(cur) : SNAPS.length; if (i > 0) { S.T = SNAPS[i - 1].c; kick(); } }
  else if (ev.key === 'Escape' && S.sel) { S.sel = null; renderDetail(); kick(); }
});

// ---------- map key ----------
$('#mkey').innerHTML = `<div><svg width="34" height="10" aria-hidden="true"><path d="M1 5h26" stroke="var(--eco)" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/><circle cx="6" cy="5" r="2.4" fill="var(--eco)"/><circle cx="16" cy="5" r="2.4" fill="var(--eco)"/><path d="M33 5l-6-3.5v7z" fill="var(--eco)"/></svg>Goods, amount known</div>
  <div><svg width="34" height="10" aria-hidden="true"><path d="M1 5h26" stroke="var(--eco)" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="6" cy="5" r="2.2" fill="var(--map-water)" stroke="var(--eco)" stroke-width="1.4"/><circle cx="16" cy="5" r="2.2" fill="var(--map-water)" stroke="var(--eco)" stroke-width="1.4"/><path d="M33 5l-6-3.5v7z" fill="var(--eco)"/></svg>Amount unknown</div>
  <div><svg width="34" height="12" aria-hidden="true"><path d="M1 6h32" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 4"/><circle cx="17" cy="6" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.4"/><path d="M14 9l6-6" stroke="var(--ink)" stroke-width="1.4"/></svg>Cut off</div>
  <div><svg width="34" height="12" aria-hidden="true"><rect x="12" y="1" width="10" height="10" fill="url(#lab-enslaved)" stroke="var(--eco-ink)"/></svg>Production site</div>`;

// ---------- prototype controls ----------
const NOTES = {
  vp: {
    A: '<b>Portrait A · Treemap.</b> Each sector’s area is its share of the people working, and its texture says how the work was done. A sector nobody can size gets a small dashed tile, never a guess.',
    B: '<b>Portrait B · Ranges.</b> Each sector is a bar from the lowest to the highest estimate, with the middle marked, so the uncertainty is the picture. Textures still say how the work was done.',
  },
  vl: {
    A: ' <b>Lane A · Stream</b> grows and shrinks with the estimated number of people, so the economy swells under Pericles and shrinks in the war.',
    B: ' <b>Lane B · Shares</b> keeps the lane full height and shows only each sector’s share.',
  },
};
function syncNote() { $('#pnote').innerHTML = NOTES.vp[S.vp] + NOTES.vl[S.vl] + '<span class="how">Press Play: the portrait changes at each snapshot (the umber lines in the lane), goods move along their routes, and Play pauses at each diamond, where war and economy meet. Click a sector to see its sites in Attica and the highlights behind it. ← → jump between snapshots. All numbers are rough sample estimates.</span>'; }
function seg(id, cb) {
  const f = document.getElementById(id);
  f.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-v]'); if (!b) return;
    f.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    cb(b.dataset.v);
  });
  return f;
}
seg('vp', v => { S.vp = v; pTo = null; pFrom = null; syncNote(); kick(); });
seg('vl', v => { S.vl = v; syncNote(); kick(); });
seg('dev', v => { device.classList.toggle('phone', v === 'phone'); });
const thm = seg('thm', v => { document.documentElement.dataset.theme = v; kick(); });
const darkNow = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
thm.querySelector(`[data-v="${darkNow() ? 'dark' : 'light'}"]`).setAttribute('aria-pressed', 'true');

new ResizeObserver(() => { app.classList.toggle('is-phone', isPhone()); layoutMaps(); pTo = null; pFrom = null; renderAxis(); kick(); }).observe(app);
app.classList.toggle('is-phone', isPhone());
layoutMaps(); syncNote(); setPlaying(false); renderAxis(); renderDetail();
document.fonts && document.fonts.ready.then(() => { pTo = null; kick(); });
})();
</script>
